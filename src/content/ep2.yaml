          impact: 7
          tags: [權威]
        - id: f3
          q: 卡爾德物流的高層，應該早就知道這份研究吧？
          a: 這份研究發表在主要期刊上，業界應該都知道。
          objection: 推測
          sustained: 異議成立。證人無從得知被告高層讀過什麼。
          impact: 5
          tags: [權威]
        - id: f4
          q: 您的同事也告訴過您，外送司機的情況更糟，對嗎？
          a: 有幾位同業這樣跟我說過。
          objection: 傳聞
          sustained: 異議成立。證人只能就自己的研究作證。
          impact: 5
          tags: [權威]
      claims:
        - id: c-applies
          text: 這個倍數適用於所有長時間駕駛的司機，包括赫克托。
          argument: arg-c
          needs: fisher-sample
          lock:
            strong:
              q: 醫師，您說「所有」長時間駕駛的司機。您的樣本裡，有市區外送司機嗎？
              a: 我的結論適用於長時間駕駛這件事本身。
            weak:
              q: 您的研究應該也適用於外送司機吧？
              a: 原則上是一樣的。
          setup:
            q: 長途貨車司機一趟平均開多久？市區外送一單呢？
            a: 長途大約九小時。市區外送……一單大概二、三十分鐘。
          confront:
            strong: （她翻到附註 7）……樣本是州際長途貨車司機。市區配送不在研究範圍內。
            weak: 樣本確實以長途司機為主，但我認為可以類推。
        - id: c-nowarn
          text: 赫克托根本沒有機會意識到自己需要休息。
          argument: arg-b
          needs: app-log
          lock:
            strong:
              q: 醫師，您是說他「根本沒有機會」知道自己該休息？
              a: 在那種工作節奏下，沒有。
            weak:
              q: 他可能沒注意到自己很累吧？
              a: 很多司機都沒注意到。
          setup:
            q: 您看過被告提出的 App 日誌嗎？
            a: 我看的是工時紀錄，沒有看提醒的部分。
          confront:
            strong: ……六十一次。我不知道系統提醒過他這麼多次。
            weak: 提醒是一回事，能不能停下來是另一回事。
      irrelevant:
        - q: 醫師，您的研究經費是誰出的？
          a: 州立大學和運輸工會。
      breakdown: （精算師把筆放下，看著證人席上的附註頁。）

  # 費雪被排除時，原告改傳一般醫學證人。
  - type: trial
    id: court-doctor
    act: 第五幕
    day: 第二天
    when:
      flags: [daubert-fisher]
    threshold: 50
    burden: civil
    quorum: 4
    patience: 5
    jurors:
      - id: j1
        label: 退休公車司機
        leans: [情感]
        start: 57
      - id: j2
        label: 保險精算師
        leans: [邏輯]
        start: 51
        foreperson: true
      - id: j3
        label: 小型物流行老闆
        leans: [權威]
        start: 47
      - id: j4
        label: 急診護理師
        leans: [情感, 邏輯]
        start: 59
      - id: j5
        label: 法律系學生
        leans: [程序]
        start: 55
      - id: j6
        label: 超市夜班主管
        leans: [權威, 情感]
        start: 53
    intro:
      - who: 羅根・普萊斯
        text: 費雪不能來了。他們找的是急診科醫師，只能講死因，不能講倍數。
        mood: 硬
    witness:
      name: 麥可・唐醫師
      role: 原告證人・急診科主治醫師
      direct:
        - id: t1
          q: 醫師，赫克托・維加的死因是什麼？
          a: 急性心肌梗塞。
          impact: 4
          tags: [權威]
        - id: t2
          q: 長時間工作會增加心肌梗塞的風險嗎？
          a: 一般而言會。疲勞、壓力、睡眠不足都是因素。
          impact: 5
          tags: [權威, 邏輯]
        - id: t3
          q: 如果他那天早點休息，就不會死，對吧？
          a: 很可能。
          objection: 推測
          sustained: 異議成立。證人無法得知假設情況下的結果。
          impact: 7
          tags: [情感]
        - id: t4
          q: 費雪醫師的研究說風險是二點四倍，您同意嗎？
          a: 我讀過那份研究，數字是那樣寫的。
          objection: 傳聞
          sustained: 異議成立。該研究已被本庭排除，證人不得轉述。
          impact: 6
          tags: [權威]
        - id: t5
          q: 公司明明可以讓他下線，卻沒有這麼做，對嗎？
          a: 從醫學角度，強制休息確實能降低風險。
          objection: 缺乏基礎
          sustained: 異議成立。證人是醫師，不是派單系統的專家。
          impact: 5
          tags: [邏輯]
      claims:
        - id: c-cause
          text: 疲勞是這次發作最主要的原因。
          argument: arg-a
          needs: pharmacy
          lock:
            strong:
              q: 醫師，您說「最主要」的原因。比沒有控制的高血壓還主要？
              a: 我說的是疲勞是重要因素。
            weak:
              q: 疲勞應該是原因之一吧？
              a: 是原因之一。
          setup:
            q: 第二期高血壓沒有服藥，三個月後發生心肌梗塞的風險高嗎？
            a: 很高。這是最主要的危險因子之一。
          confront:
            strong: （停頓）……如果他三個月只領了一次藥，那高血壓本身就是最主要的危險因子。
            weak: 兩者都有關係，我沒辦法區分。
        # 費雪被排除時，論點 B 在庭上也要有地方兌現（p-skip、p-told）。
        - id: c-unaware
          text: 以他的狀況，他自己很難察覺身體已經到極限了。
          argument: arg-b
          needs: app-log
          lock:
            strong:
              q: 醫師，您是說他沒有任何方式可以知道自己太累了？
              a: 醫學上，疲勞是很難自我察覺的。
            weak:
              q: 疲勞很難自己察覺，對嗎？
              a: 對。
          setup:
            q: 如果有一個系統，每隔一段時間就跳出來提醒他該休息了，那算不算一種方式？
            a: ……算。
          confront:
            strong: （看了一眼 App 日誌）六十一次……如果他每一次都看到了，那他知道。
            weak: 提醒是一回事，身體的感覺是另一回事。
      irrelevant:
        - q: 醫師，您在急診室工作多久了？
          a: 十五年。
      breakdown: （護理師陪審員點了點頭，像是在說：我看過太多這種病人。）

  - type: defense
    id: defense-trevor
    act: 第五幕
    day: 第三天
    witness:
      name: 崔佛・米爾斯
      role: 卡爾德快遞　營運副總
    intro:
      - who: 旁白
        text: 盧卡斯站起來：「被告傳喚崔佛・米爾斯。」崔佛扣上西裝的第一顆釦子，走向證人席。
    prep:
      hours: 2
      options:
        - id: trevor-honest
          label: 只問他確定的事
          detail: 不碰疲勞鎖的歷史。他說得越少，奧卡福能拆的越少。
          multiplier: 1
        - id: trevor-coach
          label: 替他寫好答案
          detail: 把「提醒一直都在」那句話再說一遍，說得更穩。他在錄取時已經宣誓過這句話了。
          multiplier: 1
          rehearsed: 1.6
          coached: true
          ethics: [coached-witness]
          flags: [coached-trevor]
    asks: 3
    questions:
      - id: tq-contract
        seq: 0
        q: 米爾斯先生，承攬司機可以自己決定什麼時候上線、什麼時候下線嗎？
        a: 可以。合約寫得很清楚，App 上也有下線的按鈕，隨時可以按。
        impact: 5
        tags: [權威]
      - id: tq-alert
        seq: 1
        q: 赫克托・維加連續上線十小時的時候，App 做了什麼？
        a: 跳出提醒。他最後十四天，一共收到六十一次。
        impact: 8
        tags: [邏輯]
        needs: [app-log]
      - id: tq-always
        seq: 2
        q: 疲勞提醒的設計，一直都是這樣嗎？
        a: 從系統上線就是提醒，從來沒有強制下線過。
        impact: 6
        tags: [權威]
        rehearsed: true
        door:
          q: 米爾斯先生，這是三月十四日的設定變更單。簽名的是您嗎？
          a: ……是我。
          penalty: 12
    leak:
      q: 米爾斯先生，「從來沒有」這四個字，是誰教您說的？
      a: 我……律師跟我對過答案。
      penalty: 20
    outro:
      - who: 旁白
        text: 崔佛走下證人席，沒有看被告席。羅根在筆記本上畫了一條線，又把它塗掉。

  - type: closing
    id: closing
    act: 第五幕
    place: 卡爾德郡高等法院　第五法庭
    picks: 2
    threshold: 50
    intro:
      - who: 馬庫斯・海爾
        text: 兩個論點。民事陪審團不需要被說服，只需要被說動一點點。
        mood: 暖
      - who: 盧卡斯
        text: 我知道他們會往哪邊倒。我只是不知道，我希望他們往哪邊倒。
    tones:
      - id: t-logic
        label: 邏輯
        tag: 邏輯
        text: 一張病歷、一張領藥紀錄、六十一次提醒。數字不替任何人難過，它們只記錄發生了什麼。
      - id: t-feel
        label: 情感
        tag: 情感
        text: 赫克托的死是一場悲劇。但悲劇不等於有人該為它負全責。
      - id: t-due
        label: 程序
        tag: 程序
        text: 原告要證明的是「比較可能」。不是可能，不是同情，是比較可能。
    endings:
      - id: punitive
        when:
          verdict: [有責]
          flags: [discovery:rq-chat:concealed]
        lines:
          - who: 旁白
            text: 陪審長站起來。「我們認定被告有責。另外，就懲罰性賠償，我們認定成立。」
          - who: 旁白
            text: 奧卡福在結辯裡唸出了那張截圖。一位前營運專員在開庭前兩天，把它交給了原告。
          - who: 維多莉亞・惠特洛克
            text: （電話）我們的客戶剛剛付了一筆他本來不必付的錢。下一次預算會議，你的名字會被提到。
            mood: 硬
      - id: own-choice-win
        when:
          verdict: [無責]
          theory: [own-choice]
        lines:
          - who: 旁白
            text: 陪審長站起來。「我們認定被告無責。」
          - who: 亞瑟・卡爾德
            text: （訊息）漂亮。下一件也交給你。
          - who: 旁白
            text: 法院台階上，瑪莉索・維加站在最下面一階，看著盧卡斯走出來。她什麼都沒有說。
      - id: shared-liable
        when:
          verdict: [有責]
          theory: [shared]
        lines:
          - who: 旁白
            text: 陪審長站起來。「我們認定被告有責。死者本人就其損害，與有過失百分之四十。」
          - who: 丹尼爾・奧卡福
            text: 你打得很公平，盧卡斯。我是說真的。
          - who: 瑪莉索・維加
            text: 他們承認了。判決書上寫的，他們承認了。
    verdicts:
      無責:
        - who: 旁白
          text: 陪審長站起來。「我們認定被告無責。」
        - who: 亞瑟・卡爾德
          text: （訊息）謝謝。我就知道這案子很單純。
        - who: 旁白
          text: 瑪莉索把那支螢幕裂了一角的手機收進包包，跟著奧卡福走出法庭。
      有責:
        - who: 旁白
          text: 陪審長站起來。「我們認定被告有責。」
        - who: 旁白
          text: 亞瑟・卡爾德的位子是空的。羅根替他簽收了判決書。
        - who: 維多莉亞・惠特洛克
          text: （電話）上訴的事，明天早上來我辦公室談。
          mood: 硬
      陪審團僵局:
        - who: 旁白
          text: 陪審長站起來。「庭上，我們沒有辦法達到所需的票數。」
        - who: 旁白
          text: 法官宣布審判無效。走廊上，奧卡福遞給盧卡斯一張名片，背面寫著一個數字。
        - who: 盧卡斯
          text: 評議票數
          mark: { kind: tally }

