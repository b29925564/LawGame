number: 1
title: 已收回的訊息
_cards: &cards
  - id: ethan-accused
    name: 伊森的說法：被指控盜用
    kind: 陳述
    date: 週五
    time: '16:30'
    text: 週五下午沃斯指控他盜用公款，說週一報警。他離開時喊了「等稽核報告出來，你會後悔的」。
    source: 看守所會見
  - id: ethan-ride
    name: 伊森的說法：他叫了車
    kind: 陳述
    date: 週五
    time: '22:34'
    text: 他沒有車，當晚叫車前往卡爾德大樓，路上和司機說過話。
    source: 看守所會見
  - id: ethan-message
    name: 伊森的說法：訊息被收回
    kind: 陳述
    date: 週五
    time: '23:14'
    text: 沃斯傳訊叫他上樓；他再看時訊息已被收回，但手錶當時跳過通知。
    source: 看守所會見
  - id: ethan-flee
    name: 伊森的說法：他為什麼跑
    kind: 陳述
    text: 他有前科，怕警察先抓人再問，所以躲了兩天。
    source: 看守所會見
  - id: ethan-report
    name: 伊森的說法：他先檢舉了沃斯
    kind: 陳述
    text: 週三以匿名系統檢舉一筆 3,800 萬美元的應收帳款，掛在空殼公司北門貨運名下。他記得舉報編號。
    source: 看守所會見
  - id: ethan-trophy
    name: 伊森的說法：獎盃
    kind: 陳述
    text: 他蹲下探脈搏，站起來時獎盃就在手上，自己也說不出為什麼。
    source: 看守所會見
  - id: indictment
