你為什麼沒有報警？: Why didn't you call the police?
我按了九、按了一。然後我想到上一次。上一次也是警察先來，我解釋了一年。: I pressed nine. I pressed one. Then I thought about last time. Last time the police came first too, and I spent a year explaining.
