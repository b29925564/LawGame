撤回傳票。: Withdraw the subpoena.
我出庭答辯。: I'll argue it.
我答應妳。: You have my word.
蘇菲說謊，是為了保護消息來源，不是為了掩蓋命案。: Sophie lied to protect a source, not to cover a killing.
那他要是再年輕一點，是不是可以直接回家？: So if he were a little younger, could he just go home?
血跡報告我收到了。目擊證人是誰？: I got the blood report. Who's your eyewitness?
我會再打給妳。等我手上有東西，也等我的委託人點頭。: I'll call you back. When I have something, and when my client says yes.
我記得你。伊森，發生什麼事？: I remember you. Ethan, what's going on?
慢慢說。從你收到訊息開始。: Slow down. Start from the message.
等一下。這支電話有錄音。: Wait. This line is recorded.
你跟警察說過什麼嗎？: Did you say anything to the police?
伊森，停。這支電話有錄音。: Ethan, stop. This line is recorded.
下午我過去看你。在那之前，誰問你都別開口，包括同房的人。: I'll come see you this afternoon. Until then you talk to nobody. Not even your cellmate.
先讓他講。: Let him talk.
幾點上車？: What time did you get in the car?
這件事，你還跟誰說過？: Who else have you told?
伊森，深呼吸。我哪裡都不去。: Ethan. Breathe. I'm not going anywhere.
她是唯一聽見聲音的人。我想知道她聽見的是幾點。: She's the only one who heard anything. I want to know what time she heard it.
