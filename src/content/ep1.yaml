  # E5 有罪（企劃書 10.9）：兩週後，監獄寄來的手寫信。
  - type: dialogue
    id: epilogue-letter
    act: 尾聲
    when:
      verdict: [有罪]
    place: 艾莉絲的辦公室　兩週後
    steps:
      - do: say
        who: 旁白
        text: 兩週後。郵件堆裡有一封從州立監獄寄來的信，信封上的字寫得很用力。
      - do: say
        who: 伊森・蕭
        text: （信）艾莉絲，這裡晚上十點就熄燈。我每天晚上都在想那則訊息。它真的存在過，對吧？
        mood: 緊
      - do: say
        who: 伊森・蕭
        text: （信）我姊說妳還在找上訴的理由。如果找不到，也不是妳的錯。
        mood: 緊
      - do: say
        who: 艾莉絲
        text: 當公設辯護人那四年，我也收過這種信。我一封都沒有丟。
        thought: true
      - do: say
        who: 旁白
        text: 艾莉絲把信夾進伊森的卷宗，在卷宗的標籤上用鉛筆加了兩個字：上訴。

  - type: dialogue
    id: epilogue-review
    act: 尾聲
    epilogue: true
    place: 惠特洛克・海爾律師事務所　會議室　結案後
    steps:
      - do: say
        who: 馬庫斯・海爾
        text: 不管結果怎麼寫，這一仗妳打得比我預期的乾淨。
        mood: 暖
      - do: say
        who: 維多莉亞・惠特洛克
        text: 卡爾德物流的法務今天早上打來了。他們問，妳下一次會不會也這樣查到底。
        mood: 硬
      - do: say
        who: 艾莉絲
        text: 那不是稱讚。我聽得出來。
        thought: true
      - do: say
        who: 維多莉亞・惠特洛克
        text: 事務所不是公設辯護室。記住這一點。
        mood: 硬
      - do: say
        who: 旁白
        text: 她走出會議室，沒有等我回答。

  # 蘇菲理論：信封由潔德轉交。信封本身每條路線都會出現（父親的電話要接得上碼頭九號）。
  - type: dialogue
    id: epilogue-envelope-jade
    act: 尾聲
    epilogue: true
    when:
      theory: [sophie]
    place: 艾莉絲的辦公室　影印機旁邊
    steps:
      - do: say
        who: 潔德
        text: （訊息）蘇菲託我在妳桌上放了一個信封。她說妳不配，但真相配。
        mood: 緊

  - type: dialogue
    id: epilogue-envelope
    act: 尾聲
    epilogue: true
    place: 艾莉絲的辦公室　影印機旁邊
    steps:
      - do: say
        who: 旁白
        text: 回到辦公室，桌上有一個沒有寄件人的牛皮紙信封。裡面是一份文件的影本，標題被裁掉了。是沃斯寫給「V.」、沒有寄出的郵件草稿。最後一行寫著：「星期一我會把碼頭九號的事全部說出來。」
      - do: say
        who: 蘇菲
        text: （便條）那天晚上，沃斯先生在寫的不是辭退信。是這個。
        mood: 緊
      - do: say
        who: 艾莉絲
        text: 碼頭九號。十二年前那場大火，我父親的那一場。沃斯死前打算說出來的，是這件事。
        thought: true
      - do: choose
        mode: chat
        options:
          - text: 交給海爾。事務所的事，先問事務所。
            flags: [draft-to-hale]
            then:
              - who: 艾莉絲
                text: 海爾看完草稿，沉默了很久。「這份文件，妳還給過誰？」他問的第一句不是它是真是假。
                thought: true
          - text: 自己保留。在知道它是什麼之前，誰都不給。
            flags: [draft-kept]
            then:
              - who: 艾莉絲
                text: 我把信封放進抽屜最底層，鎖上。鑰匙只有一把。
                thought: true
          - text: 交給潔德。她會知道怎麼讓它見光。
            when:
              cards: [parking-log]
            flags: [draft-to-jade]
            ethics: [leaked-client-doc]
            then:
              - who: 艾莉絲
                text: 潔德翻了兩頁就抬頭看我。「這是客戶的機密文件，妳知道這是什麼意思嗎？」我知道。
                thought: true

  - type: dialogue
    id: epilogue-smear
    act: 尾聲
    when:
      theory: [sophie]
    place: 艾莉絲的辦公室　一週後
    steps:
      - do: say
        who: 旁白
        text: 新聞 App 的頭條不是伊森。是蘇菲：〈卡爾德物流助理涉偽證？停車場紀錄曝光她命案當晚的行蹤〉。
      - do: say
        who: 旁白
        text: 有人翻出她的社群帳號，有人貼出她租屋處的地址。卡爾德物流發了一則兩行的聲明，她被解僱了。
      - do: say
        who: 艾莉絲
        text: 我沒有說她殺人。我只說她說了謊。
        thought: true
      - do: say
        who: 潔德
        text: （訊息）她那晚在車上，是在把沃斯的行事曆交給我。妳贏了。
        mood: 緊

  - type: dialogue
    id: epilogue-smear-knowing
    act: 尾聲
    when:
      theory: [sophie]
      cards: [arg-i]
    place: 艾莉絲的辦公室　一週後
    steps:
      - do: say
        who: 潔德
        text: （訊息）而且妳知道。我在電話裡親口告訴過妳，妳也答應過我。
        mood: 緊
      - do: say
        who: 艾莉絲
        text: 我知道她說謊的理由，還是選了這條路。陪審團不會記得這件事，我會。
        thought: true

  - type: dialogue
    id: epilogue-call
    act: 尾聲
    epilogue: true
    place: 艾莉絲的公寓　深夜
    steps:
      - do: say
        who: 旁白
        text: 手機響起。來電顯示：州立監獄，受刑人付費電話。
      - do: say
        who: 艾莉絲
        text: 十二年了。他從來沒有主動打給我。
        thought: true
      - do: say
        who: 父親
        text: 艾莉絲。我聽說葛蘭特・沃斯死了。妳現在在惠特洛克做事？
        mood: 緊
      - do: say
        who: 艾莉絲
        text: 你怎麼知道我在哪裡做事。
      - do: say
        who: 父親
        text: 離那間事務所遠一點。碼頭九號的事，不是只有我一個人簽過字。
        mood: 緊
      - do: say
        who: 旁白
        text: 電話斷了。螢幕上的通話時間停在 00:47。

