  - type: theory
    id: theory
    act: 第五幕
    place: 惠特洛克・海爾　會議室 A
    intro:
      - who: 馬庫斯・海爾
        text: 民事案沒有無罪，只有責任多少。你要告訴陪審團，這筆帳該怎麼算。
        mood: 暖
      - who: 羅根・普萊斯
        text: 亞瑟要的是無責。他不在乎你怎麼講，只在乎判決書上那兩個字。
        mood: 硬
    theories:
      - id: own-choice
        name: 他自己的選擇
        summary: 他知道自己有病，沒有吃藥；App 提醒了他六十一次，他每次都選擇繼續。
        needs: [arg-a, arg-b]
        cost: 最容易贏。瑪莉索會坐在旁聽席上，聽你說她丈夫是自己害死自己的。
        jury:
          leans: { 情感: 8 }
          note: 你把責任放回赫克托身上。同情瑪莉索的那幾位陪審員，會把這句話帶進評議室。
        promises:
          - id: p-meds
            text: 你們會聽到，赫克托知道自己有高血壓，而且沒有吃藥。
            argument: arg-a
          - id: p-skip
            text: 你們會聽到，公司提醒過他六十一次。
            argument: arg-b
      - id: warned
        name: 公司已盡告知義務
        summary: 不談他的病，只談公司做了什麼：提醒、合約、隨時可以下線。
        needs: [arg-b, arg-d]
        cost: 不碰病史，對瑪莉索比較公平。但對方拿出死後扣分，「由他自己決定」就很難撐。
        jury:
          all: 15
          note: 你談的是公司做了什麼，沒有回答他為什麼停不下來。進了評議室，這個問題會回來。
        promises:
          - id: p-told
            text: 你們會聽到，公司提醒過他，而且每一次都讓他自己決定。
            argument: arg-b
          - id: p-free
            text: 你們會聽到，沒有人規定他什麼時候上線、什麼時候收工。
            argument: arg-d
      - id: shared
        name: 責任該分攤
        summary: 系統有問題，赫克托也有責任。我們不說公司沒錯，我們說錯不全在公司。
        needs: [arg-a, arg-h]
        cost: 最接近真相。陪審團多半會判有責，但金額會低。亞瑟不會喜歡。
        jury:
          all: 35
          note: 你在開場就承認公司有錯。評議的時候，陪審員會從這一句開始算。
        promises:
          - id: p-both
            text: 你們會聽到，赫克托知道自己的身體出了問題。這筆帳，不該只記在一邊。
            argument: arg-a
          - id: p-last
            text: 你們會聽到，他那天傍晚說過要回家吃藥。最後兩單，是他自己選的。
            argument: arg-h

