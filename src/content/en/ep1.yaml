十二個問題，替第十三個打掩護。: Twelve questions, running cover for the thirteenth.
這是最好的選擇。｜上一次我這樣說，｜他死在裡面。: It's the right call.｜The last time I said that,｜he died in there.
選了就不能換。中途改口，陪審團只會記得你改過口。: Pick one and keep it. Change the story halfway and all they remember is that you changed it.
你一站上去，莫羅就能問四年前的事。: The second you're up there, Morrow gets to ask about four years ago.
好。從今天開始，每天練一遍最難聽的問題。: Okay. Starting today we rehearse the ugliest questions. Every day.
我建議你不要。陪審團需要的是證據，不是你上去講。: I'd advise against it. The jury needs the evidence, not you.
我要接這個案子。: I'm taking the case.
涉嫌。: Allegedly.
早上？我還沒開口。: This morning? I hadn't asked yet.
我不需要二席。: I don't need second chair.
四十小時。那我把午餐省下來。: Forty hours. I'll skip lunch.
卡爾德簽得太快了，你們不覺得嗎？: Calder signed that fast. Doesn't that bother you?
我不打算說伊森是好人。我要讓他們看見，那天晚上還有另一種可能。: I'm not going to tell them Ethan is a good man. I'm going to show them another way it could have happened.
不用了。回家吧，伊森。: No. Go home, Ethan.

