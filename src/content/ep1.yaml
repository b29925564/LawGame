# 第 1 集原型用的暫代劇本。真相：倉庫主管林國華用陳志明已掛失的門禁卡自導自演，把筆電賣給二手商。
id: ep1
title: 第 1 集：深夜倉庫（原型）

incident:
  - speaker: 旁白
    text: 週一早上八點，你第一天到蘇恩法律事務所報到。
  - speaker: 蘇律師
    text: 別坐下了。昨晚港區倉庫少了 40 台筆電，警方今早逮捕了夜班警衛陳志明。
  - speaker: 蘇律師
    text: 他說他是清白的。預審聽證在週五，唯一的目擊證人是倉庫主管林國華。
  - speaker: 蘇律師
    text: 資料都在你電腦裡。找出證詞的破綻，週五法庭見。
  - speaker: 旁白
    text: 提示：打開桌面上的程式閱讀資料，把有用的東西「列為證據」。準備好了再前往法庭。

characters:
  - id: su
    name: 蘇律師
    role: 資深合夥人，你的上司
  - id: chen
    name: 陳志明
    role: 委託人，夜班警衛
  - id: lin
    name: 林國華
    role: 倉庫主管，檢方證人

evidence:
  - id: lostcard-email
    name: 門禁卡掛失信
    description: 陳志明 21:40 寄給林國華的信，通報門禁卡（卡號 0417）遺失。
  - id: badge-log
    name: 門禁紀錄
    description: 23:02 卡號 0417 刷入 B 倉。
  - id: inventory
    name: 失竊清單
    description: B 倉短少筆電 40 台，市價約 120 萬元。
  - id: cctv-store
    name: 超商監視器畫面
    description: 22:52 至 23:14，陳志明都在倉庫兩條街外的超商內用餐。
  - id: call-log
    name: 林國華通聯紀錄
    description: 23:05 林國華撥給「阿凱二手電子收購」，通話 4 分鐘。

documents:
  - id: mail-brief
    app: mail
    title: 新案子交給你了
    from: 蘇律師
    body: |
      陳志明，夜班警衛，被控竊取 B 倉 40 台筆電。
      檢方的底牌是林國華的目擊證詞和門禁紀錄。
      我已經申請調閱相關資料，陸續會寄給你。記住：法官只看證據。
  - id: mail-lostcard
    app: mail
    title: 轉寄：門禁卡不見了
    from: 陳志明
    body: |
      律師您好，這是我那天晚上寄給林主管的信，轉給您參考。

      ---- 原始郵件 ----
      寄件時間：21:40
      收件人：林國華
      主管，我的門禁卡（0417）好像掉在停車場了，麻煩先幫我停用，明天再補辦。
    evidence: [lostcard-email]
  - id: mail-discovery
    app: mail
    title: 檢方證據開示
    from: 地檢署
    body: |
      依法開示本案證據如下：
      一、B 倉門禁紀錄：23:02 卡號 0417（登記人陳志明）刷卡進入。
      二、失竊清單：筆電 40 台，市價約 120 萬元。
    evidence: [badge-log, inventory]
  - id: file-indictment
    app: files
    title: 起訴書摘要
    body: |
      被告陳志明於案發當晚 23:00 左右，持本人門禁卡進入 B 倉，竊取筆電 40 台。
      證人林國華當時於二樓辦公室加班，親眼目睹被告進入 B 倉。
  - id: file-witness
    app: files
    title: 證人名單
    body: |
      林國華，港區倉庫主管，任職 12 年。
      案發當晚自稱獨自在二樓辦公室盤點至午夜。
  - id: cctv-gate
    app: cctv
    title: 倉庫大門 22:30–23:30
    body: |
      【播放中】22:58 起畫面出現雜訊，23:00 至 23:10 的片段無法讀取。
      倉庫方面表示是「設備老舊」。
  - id: cctv-store
    app: cctv
    title: 街角超商 22:45–23:20
    body: |
      【播放中】22:52 一名穿警衛制服的男子進店，買了便當在窗邊座位用餐。
      放大制服名牌：陳志明。23:14 離開。
    evidence: [cctv-store]
  - id: phone-chen
    app: phone
    title: 陳志明通聯紀錄
    body: |
      21:38 撥出：林國華（未接）
      23:30 撥出：媽媽（6 分鐘）
  - id: phone-lin
    app: phone
    title: 林國華通聯紀錄（法院調閱）
    body: |
      21:41 來電：陳志明（未接）
      23:05 撥出：阿凱二手電子收購（4 分鐘）
      23:50 撥出：阿凱二手電子收購（1 分鐘）
    evidence: [call-log]

trial:
  witness: lin
  persuasion: 3
  intro: 檢方傳喚證人林國華。請仔細聽證詞，發現矛盾就出示證據。
  wrongEvidence: 法官皺眉：「律師，這份證據跟證詞有什麼關係？」陪審團的信任下降了。
  statements:
    - id: s-overtime
      text: 我是倉庫主管，那天晚上一個人在二樓辦公室加班盤點。
      press: 「我 10 點半開始盤點，一直做到快 12 點。這是我的工作。」
    - id: s-saw
      text: 晚上 11 點整，我從辦公室窗戶親眼看到陳志明走進 B 倉。
      press: 「我看得很清楚，就是他那身警衛制服。」
      contradiction:
        evidence: cctv-store
        rebuttal: 「22:52 到 23:14，陳志明人在兩條街外的超商吃便當。證人，您在 11 點整看到的是誰？」林國華臉色一沉。
    - id: s-badge
      text: 門禁紀錄也證明了，23:02 是他的卡刷進 B 倉的。
      press: 「那張卡只有他在用，還能是誰？」
      contradiction:
        evidence: lostcard-email
        rebuttal: 「這張卡 21:40 就向您本人掛失了。您收到信卻沒有停用，而且卡片後來在誰手上？」旁聽席一陣騷動。
    - id: s-alone
      text: 我整晚都待在辦公室，沒有跟任何外人聯絡。
      press: 「盤點很忙，我連手機都沒看。」
      contradiction:
        evidence: call-log
        rebuttal: 「23:05，也就是 B 倉被刷卡進入三分鐘後，您撥電話給一家二手電子收購商。您連手機都沒看？」林國華說不出話來。
    - id: s-missing
      text: 隔天早上清點，少了 40 台筆電。除了他還會有誰？
      press: 「40 台，價值一百多萬。這種事我不可能記錯。」
  verdict:
    win: 法官宣布：檢方證據不足，駁回起訴。當天下午，警方以背信與竊盜罪嫌約談林國華。蘇律師只說了一句：「不錯，明天準時上班。」
    lose: 陪審團對你的論點失去信心，案件被移送正式審判。蘇律師嘆了口氣：「回去把資料再看一遍。」
