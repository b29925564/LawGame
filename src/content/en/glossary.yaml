# English for the glossary (法典百科). Key = Chinese source string exactly; term keys map to the English name.
超越合理懷疑: Beyond a reasonable doubt
刑事案件定罪的門檻。檢方要證明到一個講理的人不會再有合理的懷疑，陪審團才能判有罪。被告不必證明自己無辜。: The standard for a criminal conviction. The prosecution must prove its case so well that a reasonable person would have no reasonable doubt left; only then can the jury convict. The defendant never has to prove innocence.
陪審員的「有罪傾向」到 70 以上才會投有罪；你的工作是讓夠多人留在線下。: A juror votes guilty once their lean passes 70. Your job is to keep enough of them below the line.
相關性: Relevance
證據要能讓某個重要事實「更可能或更不可能」成立，才可以在法庭上使用。和案件無關的東西，法官會排除。: Evidence is admissible only if it makes some fact that matters more or less likely. Anything unrelated to the case, the judge keeps out.
聲請傳票或調閱資料時，最常用的法律依據。你要說明這份東西和本案哪個爭點有關。: The most common legal basis for a subpoena or records request. You have to say which issue in the case the material bears on.
傳聞證據: Hearsay
證人轉述「別人在法庭外說過的話」，用來證明那句話的內容是真的。因為原說話的人不能被交叉詰問，原則上不能用。: A witness repeating what someone else said outside the courtroom, offered to prove that it was true. The original speaker can't be cross-examined, so as a rule it's not allowed.
對方證人說「我聽某某說……」時，可以提出傳聞異議。: When the other side's witness says "I heard so-and-so say…," you can object as hearsay.
傳聞例外: Hearsay exception
某些庭外陳述雖然是傳聞，但因為可信度高，法律允許使用，例如當下的激動陳述、業務上的紀錄。: 'Some out-of-court statements are hearsay but reliable enough that the law lets them in: an excited utterance in the moment, or a record kept in the ordinary course of business.'
米蘭達警告: Miranda warning
警察在拘禁中訊問嫌犯前，必須告知緘默權與請律師的權利。沒告知就問出來的供述，通常不能拿來當不利被告的證據。: Before questioning a suspect in custody, police must advise them of the right to remain silent and the right to a lawyer. A statement obtained without that warning usually can't be used against the defendant.
如果被告的話是在沒有警告的情況下被問出來的，可以聲請排除。: If the defendant's words were drawn out without a warning, you can move to suppress them.
證據基礎: Foundation
提出一份證據前，要先證明它是什麼、從哪裡來、為什麼可信。基礎沒打好，證據進不了法庭。: Before a piece of evidence comes in, you have to show what it is, where it came from and why it can be trusted. Without that foundation, it never reaches the courtroom.
異議: Objection
律師認為對方的問題或證據違反規則時，當庭提出反對。法官當場裁定成立或駁回。: "When a lawyer believes the other side's question or evidence breaks the rules, they object on the spot. The judge rules immediately: sustained or overruled."
庭上的異議要說得出理由；亂喊會消耗法官的耐心。: In court, an objection needs a reason. Shouting them at random wears down the judge's patience.
異議成立／駁回: Sustained / Overruled
「成立」代表問題或回答被排除，陪審團應該忽略它。「駁回」代表反對無效，證人仍需回答這個問題。: '"Sustained" means the question or answer is struck and the jury should disregard it. "Overruled" means the objection fails and the witness still has to answer.'
異議（取證中）: Objection at deposition
取證通常在事務所進行，現場沒有法官可以裁決。律師提出的異議只會記在筆錄上，留待開庭前由法官處理，所以證人仍須回答。例外是涉及律師保密特權等情況，律師可以指示證人不回答。: 'A deposition usually happens at a law office, with no judge in the room to rule. Objections only go on the record, to be dealt with before trial, so the witness still answers. The exception is privilege: a lawyer can instruct the witness not to answer.'
取證時你提出的異議會記錄在案，但不會擋下問題。: Objections you raise at a deposition are recorded but don't stop the question.
主詰問: Direct examination
傳喚證人的一方先問自己的證人。原則上不能用誘導式問題，要讓證人自己把事情講出來。: The side that called the witness questions them first. Leading questions are generally not allowed; the witness has to tell it in their own words.
交叉詰問: Cross-examination
對方證人講完後，由你提問。可以用誘導式問題，目的是找出矛盾、削弱可信度。: After the other side's witness has testified, you question them. Leading questions are allowed; the goal is to find contradictions and undercut credibility.
庭審的主要戰場：拿證據對質，抓出證詞裡兜不起來的地方。: "The main battleground of the trial: confront testimony with evidence and find where it doesn't add up."
彈劾: Impeachment
證明證人不可信，例如他之前說過不一樣的話、有偏見或利害關係、或當時根本看不清楚。: "Showing that a witness can't be trusted: they said something different before, they have a bias or a stake, or they couldn't really have seen it."
用卡片指出證詞的矛盾，成功彈劾會讓陪審團不再相信那段證詞。: Use cards to point out contradictions in testimony. A successful impeachment makes the jury stop believing that part.
證據開示: Discovery
開庭前雙方必須交換手上的證據與證人名單，避免突襲。檢方還有義務交出對被告有利的證據。: Before trial, both sides must exchange their evidence and witness lists so nobody gets ambushed. The prosecution also has to turn over anything favorable to the defendant.
認罪協商時，檢察官會核對開示過的證據清單；沒開示的東西撐不起虛張聲勢。: In plea talks, the prosecutor checks what's on the disclosure list. Something you never disclosed won't carry a bluff.
傳票: Subpoena
法院命令某人出庭作證，或交出特定文件、紀錄。不服從可能被處罰。: A court order for someone to appear and testify, or to hand over specific documents or records. Ignoring it can be punished.
向法院系統聲請，三樣要對：法律依據、支撐的證據、請求的內容。: "Apply through the court system. Three things have to line up: the legal basis, the supporting evidence and what you're asking for."
保護令（營業秘密）: Protective order
當要交出的資料涉及營業秘密或隱私時，法院可以限制誰能看、能怎麼用，而不是乾脆不准調閱。: When records involve trade secrets or privacy, the court can limit who may see them and how they may be used, instead of refusing access altogether.
取證（宣誓陳述）: Deposition
開庭前在法庭外對證人宣誓問話，全程逐字記錄。之後證人在庭上說法不一，可以拿筆錄出來對質。刑事案多數州不允許辯方取證，只有少數州（遊戲裡的卡爾德州是其中之一）允許。: Sworn questioning of a witness outside court before trial, transcribed word for word. If the witness tells it differently at trial, the transcript comes out. Most states don't allow defense depositions in criminal cases; only a few, including the game's State of Calder, do.
認罪協商: Plea bargain
檢方提出較輕的罪名或刑期，換被告認罪、不必開庭。決定權在被告，不在律師。: The prosecution offers a lighter charge or sentence in exchange for a guilty plea and no trial. The decision belongs to the defendant, not the lawyer.
你可以建議，但伊森自己決定；他對你的信任不夠時，可能不聽。: You can advise, but Ethan decides for himself. If he doesn't trust you enough, he may not listen.
陪審團遴選: Voir dire
開庭前雙方詢問候選陪審員，找出有偏見的人並請求排除。: Before trial, both sides question prospective jurors to find bias and ask to have them removed.
有因迴避: Challenge for cause
候選人表現出明確偏見時，請法官把他排除。次數不限，但要有根據。: When a candidate shows clear bias, you ask the judge to remove them. Unlimited, but you need grounds.
候選人要自己說出偏見才會成立；沒憑沒據，法官會記住。: It only works if the candidate said the biased thing themselves. Ask without grounds and the judge remembers.
無因迴避: Peremptory challenge
不必說理由就能排除候選人，但次數有限。不能用來依種族或性別排除。: Removing a candidate without giving a reason. The number is limited, and it can't be used to strike by race or sex.
二級謀殺: Second-degree murder
有殺人故意，但沒有事先預謀。比一級謀殺輕，刑期仍然很重。: An intentional killing without premeditation. Lighter than first-degree murder, but the sentence is still severe.
案件理論: Theory of the case
辯方用一句話講清楚「到底發生了什麼事」。開場、詰問、結辯都要圍繞它，陪審團才記得住。: The defense's one-sentence account of what actually happened. Opening, examination and closing all have to revolve around it, or the jury won't remember.
開場陳述: Opening statement
庭審一開始向陪審團預告你會證明什麼。說出口的承諾，如果之後做不到，陪審團會記得。: At the start of trial you tell the jury what you're going to prove. Promise something and fail to deliver, and the jury remembers.
結辯: Closing argument
證據調查結束後，把所有證據串成一個故事，說服陪審團。結辯本身不是證據。: After the evidence is in, you tie it all into one story to persuade the jury. The closing itself is not evidence.
審前動議: Pretrial motion
開庭前請法官先就某件事做裁定，例如排除某項證據或核發傳票。動議要寫清楚依據、請求，以及支撐它的事實。: Asking the judge to rule on something before trial, such as excluding a piece of evidence or issuing a subpoena. A motion needs a basis, a request and the facts that support it.
法院系統裡的聲請就是動議：依據、請求、支撐三樣都要對。: 'Applications in the court system are motions: basis, request and support all have to be right.'
排除證據: Motion to suppress
違法取得的證據（例如沒有給米蘭達警告就問出來的供述）可以請法官禁止在庭上使用，陪審團就不會看到。: Evidence obtained illegally (for example, a statement taken without a Miranda warning) can be barred from trial, so the jury never sees it.
誘導性問題: Leading question
問題本身已經暗示了答案，例如「你當時很害怕，對吧？」。主詰問自己的證人時不能問，交叉詰問對方證人時可以。: A question that suggests its own answer, like "You were scared, weren't you?" Not allowed on direct examination of your own witness; allowed on cross of the other side's.
對方用誘導性問題問己方證人時，你可以提出異議。: When the other side leads your witness, you can object.
推測: Speculation
要求證人回答他沒有親身知道的事，例如猜別人在想什麼。這是常見的異議理由。: Asking a witness about something they have no personal knowledge of, such as guessing what someone else was thinking. A common ground for objection.
前科與品格證據: Prior convictions / character evidence
一般不能用被告過去做過的壞事，來證明他這次也做了。前科只有在特定情況下（例如彈劾被告的誠信）才可能被提出。: As a rule, a defendant's past bad acts can't be used to prove they did it this time. Prior convictions come in only in specific situations, such as impeaching the defendant's honesty.
專家證人: Expert witness
具備專業知識的證人，例如法醫或數位鑑識人員。一般證人只能說親眼所見，專家可以對證據提出專業意見。: A witness with specialized knowledge, like a medical examiner or a digital forensics analyst. Ordinary witnesses can only say what they saw; experts may give professional opinions on the evidence.
證人準備: Witness preparation
開庭前和己方證人演練會被問什麼、怎麼清楚作答。可以幫證人整理記憶，但不能教他說謊或改變事實。: "Rehearsing with your own witness before trial: what they'll be asked, how to answer clearly. You may help them organize their memory; you may not coach them to lie or change the facts."
怎麼準備證人會記進倫理紀錄。: How you prepare a witness goes on your ethics record.
撤銷傳票: Motion to quash
收到傳票的一方可以聲請法官撤銷，理由例如負擔過重、涉及營業秘密，或與本案無關。: Whoever receives a subpoena can ask the judge to quash it, for example because it's unduly burdensome, involves trade secrets or has nothing to do with the case.
舉證責任: Burden of proof
刑事案件由檢方負責證明被告有罪，被告不必證明自己無罪。辯方只要讓陪審團產生合理懷疑就夠了。: In a criminal case the prosecution must prove guilt; the defendant doesn't have to prove innocence. The defense only needs to leave the jury with a reasonable doubt.
緘默權: Right to remain silent (Fifth Amendment)
任何人都不必說出可能讓自己入罪的話。證人在庭上援引這項權利，陪審團會看在眼裡，但不能直接把沉默當成認罪。: Nobody has to say anything that might incriminate them. When a witness invokes it on the stand, the jury sees it, but silence can't be treated as a confession.
律師保密特權: Attorney–client privilege
律師與當事人之間為了尋求法律意見的溝通受到保護，對方不能強迫揭露，在取證中也可以拒答。: Communications between a lawyer and client for the purpose of legal advice are protected. The other side can't force them out, and a witness may refuse to answer about them at a deposition.
宣誓: Oath
證人在作證或取證前宣誓說實話。宣誓後說謊就是偽證罪。: A witness swears to tell the truth before testifying or being deposed. Lying under oath is perjury.
起訴書: Indictment / information
檢方正式指控被告犯了什麼罪的文件，也決定了審判要證明的範圍。: The document in which the prosecution formally charges the defendant with a crime. It also sets the scope of what the trial has to prove.
預審: Pretrial hearing
正式審判前的庭期，處理動議、證據爭議和審判日程。: Court dates before the trial proper, for motions, evidence disputes and scheduling.
利益衝突豁免: Conflict waiver
律師的其他客戶或事務所的利益可能和這件案子衝突時，需要相關客戶書面同意（簽豁免書），律師才能繼續代理。: When another client's interests, or the firm's, may conflict with this case, the affected clients have to consent in writing (sign a waiver) before the lawyer can go on representing.
評議: Deliberation
陪審團退庭後關起門來討論證據，決定有罪或無罪。重罪的刑事判決必須全體一致（2020 年 Ramos v. Louisiana 之後全美皆然）。: The jury retires behind closed doors to weigh the evidence and decide guilty or not guilty. A felony verdict must be unanimous, everywhere in the country since Ramos v. Louisiana (2020).
陪審團僵局: Hung jury
陪審團討論後仍無法達成一致。法官會宣告審判無效，檢方可以決定是否重新起訴。: The jury can't reach the required agreement after deliberating. The judge declares a mistrial, and the prosecution decides whether to try the case again.
優勢證據: Preponderance of the evidence
民事案件的舉證門檻：原告只要讓陪審團覺得自己的說法「比較可能」是真的，就贏了。一半多一點點就夠。: 'The burden of proof in a civil case: the plaintiff wins if the jury finds their version "more likely than not" true. A hair over half is enough.'
民事案的陪審員到 50 以上就會投有責；這一次站在線上的是你。: In a civil case a juror votes liable once their lean passes 50. This time you're the one on the line.
比較過失: Comparative negligence
原告自己也有過失時，陪審團會算出一個比例，照比例扣掉賠償。多數州採「修正比較過失」：原告過失超過一半就一毛都拿不到。: 'When the plaintiff was partly at fault too, the jury sets a percentage and the award is cut by that share. Most states use "modified" comparative negligence: a plaintiff more than half at fault recovers nothing.'
民事案裡選「分攤」一類的理論，等於請陪審團替原告那邊算一個比例。: Picking a "share the blame" theory in a civil case means asking the jury to put a percentage on the plaintiff's side.
懲罰性賠償: Punitive damages
在損害賠償之外，為了懲罰被告特別惡劣的行為而加判的錢。門檻比優勢證據高，要有「明確且令人信服」的證據。: 'Money awarded on top of compensation to punish especially bad conduct by the defendant. The bar is higher than preponderance: the evidence must be "clear and convincing."'
被告明知風險還為了利益拿掉安全措施，就是原告會拿來主張的那種證據。: A defendant who knew the risk and removed a safeguard for profit is exactly what a plaintiff points to.
Daubert 標準: Daubert standard
專家證詞要進法庭，法官先把關：方法可不可靠、有沒有同儕審查、套用到本案合不合適。方法套錯了對象，結論就不該讓陪審團聽到。: "Before expert testimony reaches the jury, the judge gatekeeps: is the method reliable, has it been peer-reviewed, does it fit this case? A method applied to the wrong population shouldn't reach the jury."
對方專家的樣本和本案的對象不一樣時，可以聲請排除她的證詞。: When the other side's expert studied a different population from the one in this case, you can move to exclude the testimony.
調解: Mediation
開庭前由中立的調解人（常是退休法官）協助雙方談和解。調解人不裁決，只來回傳話、逼雙方面對自己可能會輸的地方。: Before trial, a neutral mediator (often a retired judge) helps the two sides settle. The mediator decides nothing; they carry offers back and forth and make each side face where it might lose.
調解室裡對方的開價會一路往下；超過客戶授權就要打電話請示。: In the mediation room the other side's number keeps dropping. Anything above your client's authority means a phone call.
特權清單: Privilege log
開示時主張某些文件受律師保密特權保護、不交出去，必須列一張清單說明是哪些文件、為什麼不交。對方可以請法官審查。: 'When you withhold documents in discovery as privileged, you must list them: which documents, and why. The other side can ask the judge to review.'
營運文件不是律師意見，主張特權法官不會買單；法務意見書才站得住。: An operations document isn't legal advice; a judge won't buy privilege on it. A memo from counsel is another matter.
範圍過廣的請求: Overbroad request
對方的開示請求要的太多、和爭點關係太遠時，可以請法官限縮範圍，例如只交死者本人、最後九十天的紀錄。: When the other side's discovery request asks for far too much, or reaches too far from the issues, you can ask the judge to narrow it, say to one person's records for the last ninety days.
對方要全公司好幾年的紀錄時，法官會限縮；限縮後該交的還是要交。: Ask for a whole company's records going back years and the judge will narrow it. What's left after narrowing still has to be produced.
過失致死訴訟: Wrongful death
死者家屬向造成死亡的人或公司請求賠償的民事訴訟。要證明被告有注意義務、違反了、而且這個違反造成死亡。: A civil suit by the family of someone who died against the person or company responsible. They must show the defendant owed a duty of care, breached it, and that the breach caused the death.
被告常主張死者是承攬人、公司沒有照顧義務；控制程度有爭議時，法官會交給陪審團。: Defendants often argue the deceased was a contractor the company owed no duty to. When the degree of control is disputed, the judge leaves it to the jury.
近因效應: Recency effect
人比較容易記得最後聽到的東西。結辯時把最強的論點放在最後，影響力最大。: People remember best what they heard last. Put your strongest argument at the end of the closing and it carries the most weight.
結辯最後一個論點的衝擊 ×1.3。: The last argument in your closing has its impact multiplied by 1.3.
