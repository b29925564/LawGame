  # 提前收場（企劃書 10.9）：E1 撤回起訴、E4 認罪協商。之後只演標了 epilogue 的尾聲。
  - type: dialogue
    id: epilogue-dismissed
    act: 尾聲
    epilogue: true
    when:
      outcome: [dismissed]
    place: 郡法院　第三法庭外走廊　隔天上午
    steps:
      - do: say
        who: 旁白
        text: 隔天上午九點，莫羅檢察官向法庭撤回對伊森・蕭的起訴。兩名警員在旁聽席後排等著瑞秋・艾德勒。
      - do: say
        who: 旁白
        text: 瑞秋站起來的時候，先把西裝外套的扣子扣好。她經過辯方席，沒有看任何人。
      - do: say
        who: 伊森・蕭
        text: 就這樣？我……可以走了？
        mood: 緊
      - do: say
        who: 艾莉絲
        text: 可以走了。回家吧，伊森。
      - do: say
        who: 旁白
        text: 走廊上，莫羅檢察官把卷宗夾在手臂下，在電梯前停住。
      - do: say
        who: 凱瑟琳・莫羅
        text: 下次，早點打給我。
        mood: 硬
      - do: say
        who: 艾莉絲
        text: 她沒有說謝謝，我也沒有。我們都知道，這個案子差一點就判下去了。
        thought: true

