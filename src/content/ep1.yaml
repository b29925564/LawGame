    theories:
      - id: doubt
        name: 合理懷疑
        summary: 檢方的證據有漏洞。我們不指認任何人，只證明他們沒有證明。
        needs: [arg-a, arg-b]
        cost: 最安全。但真兇逍遙法外，伊森只是「查無實據」。
        promises:
          - id: doubt-called
            text: 你們會聽到，伊森是被人叫上樓的，不是自己決定去的。
            argument: arg-a
          - id: doubt-time
            text: 你們會聽到，沃斯在伊森抵達之前就已經死了。
            argument: arg-b
      - id: sophie
        name: 另有其人：蘇菲
        summary: 命案當晚還在大樓的人，對警方說了謊。她是檢方的證人。
        needs: [arg-h]
        cost: 情感取向的陪審員容易被說服，但蘇菲的人生會被毀掉。要在庭上讓她自己鬆口，沒有別的證據能替妳補。
        ethicsIf:
          has: [arg-i]
          ethics: [smeared-knowing, smeared-knowing]
        promises:
          - id: sophie-lied
            text: 你們會看到，另一個人對警方說了謊。
            argument: arg-h
      - id: rachel
        name: 另有其人：瑞秋
        summary: 那則訊息是別人傳的，收回訊息的人當時就在 31 樓。她是檢方的證人。
        needs: [arg-a, arg-b, arg-c, arg-d]
        cost: 最難。要在庭上彈劾一位看似無懈可擊的證人；做不到，許下的承諾會全部反噬。
        promises:
          - id: rachel-time
            text: 你們會聽到，沃斯在伊森抵達之前就已經死了。
            argument: arg-b
          - id: rachel-sender
            text: 你們會知道，那則訊息是誰傳的。
            argument: arg-c
          - id: rachel-alone
            text: 你們會知道，那一晚 31 樓只剩下一個人。
            argument: arg-d

