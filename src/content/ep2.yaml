    topics:
      - id: d-system
        label: 那套系統
        questions:
          - id: d-alert
            q: 林先生，赫克托・維加死亡當天，疲勞提醒是怎麼運作的？
            a: 連續上線十小時跳出提醒。司機可以休息，也可以略過。
          - id: d-always
            q: 這個機制一直都是這樣嗎？
            a: 從系統上線就是提醒，從來沒有強制下線過。
            anchors: trevor-sworn
          - id: d-change
            q: 三月份，系統是不是有一次設定變更？
            a: ……系統每一季都在改版。我不記得每一張變更單。
            objection: 缺乏基礎
            tips: [arg-e]
      - id: d-hector
        label: 赫克托
        questions:
          - id: d-rating
            q: 司機拒單，評分會怎麼樣？
            a: 會下降。那是服務品質指標，所有平台都有。
          - id: d-know
            q: 你知道赫克托連續上線十四天嗎？
            a: 系統裡有四千多個司機。我不可能每一個都看。
      - id: d-people
        label: 誰決定的
        questions:
          - id: d-who
            q: 疲勞管理的設定，最後是誰核准的？
            a: 營運部。我是營運部的主管。
          - id: d-legal
            q: 你在做決定之前，有沒有詢問過法律意見？
            a: 我們每一個決定都會問法務。妳應該知道是哪一家。
            objection: 特權

