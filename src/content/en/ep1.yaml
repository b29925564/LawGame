替他寫好答案: Write his answers
每一題都有一段背好的答案。聽起來很穩，但一被打斷就會亂。: A memorized answer for every question. Sounds steady. Falls apart the first time he's interrupted.
伊森，週五晚上十點半，你收到了什麼？: Ethan, Friday night at ten thirty. What did you receive?
