  # 所有路線都接：戴文與那張銷毀令，然後是父親的電話。
  - type: dialogue
    id: epilogue-devon
    act: 尾聲
    epilogue: true
    place: 惠特洛克・海爾　影印室　晚上 22:10
    steps:
      - do: say
        who: 旁白
        text: 影印機還在出紙。戴文把一張舊文件放上掃描台，放大到百分之四百。
      - do: say
        who: 戴文
        text: 葛雷律師，你還在嗎？那份文件保存政策的附件，二〇一六年那張。
      - do: say
        who: 戴文
        text: 「碼頭九號倉庫維修紀錄備份：依政策銷毀。」核准人簽名……我放大了。
      - do: say
        who: 戴文
        text: 是 V. 惠特洛克。
      - do: say
        who: 戴文
        text: 羅根叫我別多事。我……我想先讓你知道。
      - do: say
        who: 盧卡斯
        text: V.
        mark: { kind: highlight, word: V. }

  - type: phone
    id: epilogue-father
    act: 尾聲
    epilogue: true
    owner: 盧卡斯
    steps:
      - do: caption
        time: '23:40'
        text: 港灣大道一號，頂樓只剩一盞燈。盧卡斯的手機響了。
      - do: notify
        time: '23:40'
        message:
          from: 卡爾德港州立監獄
          text: 您有一通來自受刑人的電話。本通話將被錄音。
      - do: talk
        time: '23:41'
        who: 林肯・高
        text: 我聽說你替卡爾德打了一場官司。
      - do: choose
        mode: talk
        options:
          - text: 爸。二〇一六年，是誰下令銷毀維修紀錄的？
            then:
              - who: 林肯・高
                text: ……你在那裡找到了什麼？
          - text: 我只是做我的工作。
            then:
              - who: 林肯・高
                text: 我以前也是這樣跟你媽說的。
      - do: talk
        time: '23:43'
        who: 林肯・高
        text: 承曦，小心那棟樓裡簽名的人。
