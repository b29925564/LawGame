        - id: priya-honest
          label: 對一次順序
          detail: 兩個小時，把心率、稽核紀錄、手錶通知照時間排好。措辭是她自己的。
          multiplier: 1
    asks: 3
    questions:
      - id: pq-cred
        seq: 0
        q: 奈爾博士，您做數位鑑識多久了？
        a: 十四年。法院指定過我十一次，檢方也找過我。
        impact: 2
        tags: [權威]
      - id: pq-hr
        seq: 1
        q: 沃斯先生手錶上的心率紀錄，可信嗎？
        a: 原始檔有雜湊值，沒有被動過。22:24 心率衝高，然後歸零，之後是一條直線。
        impact: 5
        tags: [邏輯, 權威]
        needs: [heart-rate]
      - id: pq-notice
        seq: 2
        q: 被告說他收到過一則訊息，後來不見了。有沒有地方留下紀錄？
        a: 他的手錶。22:33 跳過一則通知，寄件人是葛蘭特・沃斯。手機上收回，手錶上的通知紀錄不會跟著消失。
        impact: 4
        tags: [邏輯]
        needs: [watch-notice]
      - id: pq-audit
        seq: 3
        q: 聊天系統的稽核紀錄裡，那則訊息是從哪裡發出、又是從哪裡收回的？
        a: 同一台桌機，沃斯先生辦公室裡那台。22:31 發出，23:14 收回。
        impact: 6
        tags: [邏輯]
        needs: [chat-audit]
        door:
          q: 奈爾博士，您能告訴陪審團，23:14 坐在那台桌機前面的是誰嗎？
          a: 不能。我能告訴你是哪台電腦，不能告訴你是哪雙手。
          penalty: 5
    leak:
      q: 奈爾博士，辯方律師有沒有替您擬過證詞？
      a: 她給過我問題的順序。答案是我自己的。
      penalty: 4
    outro:
      - who: 旁白
        text: 莫羅檢察官翻了兩頁筆記，只問了一題。

