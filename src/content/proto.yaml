# 原型用：只取第一集的一段（證據板 → 詰問法醫 → 詰問瑞秋 → 結辯與評議），用來回答企劃書 v2.0 第 15 節的問題。
id: proto-ep1
title: 《合理懷疑》原型：已收回的訊息
intro:
  - 卡爾德物流財務長葛蘭特・沃斯週五深夜陳屍在 31 樓辦公室。被告伊森・蕭說，是沃斯傳訊叫他 22:45 上樓的，但那則訊息已經被收回了。
  - 你是辯護律師艾莉絲・韓。調查已經結束，桌上是你拿到的卡片。先在證據板上把推理鏈拼起來：每次提交花 1 工時，整條全對才會確認，遊戲不會告訴你錯在哪。
  - 確認的推理會變成論點卡，開庭時用來彈劾檢方的目擊證人瑞秋・艾德勒。彈劾要三步：先讓她把說法講死（鎖定），再確立你的證據可信（鋪陳），最後出示論點（對質）。
  - 陪審團有 12 個人。刑事案要 12 人都認為「超越合理懷疑」才會定罪；只要有人動搖，就不是有罪。看他們的表情決定下一步。
hours: 7
threshold: 70
patience: 5

cards:
  - id: uber
    name: 叫車收據
    kind: 事實
    time: '22:34'
    text: 伊森 22:34 從家裡上車，22:44 抵達卡爾德大樓。
  - id: watch-note
    name: 伊森手錶的通知
    kind: 事實
    time: '22:33'
    text: 22:33 通知：「葛蘭特・沃斯：十點四十五分上來，我們談談。」
  - id: coroner
    name: 法醫報告
    kind: 事實
    admitted: true
    text: 死因為鈍器重擊頭部。死亡時間推估 22:00 至 23:30。
  - id: heart
    name: 沃斯手錶心率紀錄
    kind: 事實
    time: '22:24'
    text: 沃斯的心率在 22:24 急遽升高後歸零，之後再無讀數。
  - id: chat-audit
    name: 聊天系統稽核紀錄
    kind: 事實
    time: '23:14'
    text: 22:31 由沃斯桌機發送訊息給伊森；23:14 由同一台桌機收回。
  - id: badge-full
    name: 完整門禁紀錄
    kind: 事實
    admitted: true
    time: '23:26'
    text: 當晚進過 31 樓的人裡，23:14 時還沒離開大廳的只剩瑞秋・艾德勒，她 23:26 才刷卡離開。
  - id: meeting-log
    name: 新加坡會議紀錄
    kind: 事實
    time: '22:08'
    text: 陳偉倫主持的季度會議，系統紀錄顯示瑞秋 22:08 離線，之後沒有再加入。
  - id: rachel-statement
    name: 瑞秋的警詢筆錄
    kind: 陳述
    text: 「我整晚都在跟新加坡開會，開到快十一點。22:50 左右聽到沃斯辦公室有爭吵和東西倒地的聲音。」
  - id: badge-police
    name: 警方標記的門禁紀錄
    kind: 事實
    admitted: true
    time: '22:47'
    text: 伊森 22:47 刷卡進入 31 樓，23:01 離開大廳。
  - id: fingerprint
    name: 指紋報告
    kind: 事實
    admitted: true
    text: 凶器獎盃上驗出伊森的指紋。
  - id: sophie
    name: 蘇菲的陳述
    kind: 陳述
    text: 「伊森下午在走廊對沃斯說：『你會後悔的。』」

questions:
  - id: q1
    text: 伊森為什麼那時候上樓？
    answer: [watch-note, uber]
    relation: 支持
    argument:
      id: arg-a
      name: 論點 A：伊森是被叫上樓的
      text: 22:33 伊森收到沃斯的訊息，22:34 就叫車出門，時間完全吻合。
      strength: 6
      tags: [情感, 邏輯]
  - id: q2
    text: 沃斯什麼時候死的？
    answer: [coroner, heart]
    relation: 支持
    argument:
      id: arg-b
      name: 論點 B：沃斯 22:24 就死了
      text: 心率在 22:24 歸零，落在法醫推估的窗口內，比伊森抵達早了二十分鐘。
      strength: 9
      tags: [邏輯, 權威]
  - id: q4
    text: 誰收回了那則訊息？
    answer: [chat-audit, badge-full]
    relation: 說明機會
    argument:
      id: arg-d
      name: 論點 D：23:14 時 31 樓只剩瑞秋
      text: 訊息 23:14 從沃斯的桌機被收回，那時整層樓只剩瑞秋・艾德勒還沒離開。
      strength: 8
      tags: [邏輯, 程序]
  - id: q5
    text: 瑞秋的不在場說法站得住嗎？
    answer: [rachel-statement, meeting-log]
    relation: 矛盾
    argument:
      id: arg-e
      name: 論點 E：瑞秋 22:08 就離開了會議
      text: 瑞秋說她開會開到快十一點，但會議系統顯示她 22:08 就離線了。
      strength: 6
      tags: [邏輯]

