伊森走下證人席，坐回被告席之前，先把手掌在褲子上擦了兩下。: Ethan steps down and, before sitting back at the defense table, wipes his palms twice on his trousers.
法官宣布：辯方舉證完畢。: 'The judge announces: the defense rests.'
挑三個。講最後的那一個，他們記得最清楚。: Pick three. The last one you say is the one they remember.
還有，決定你要對誰說話。十二個人不是同一種人。: And decide who you're talking to. Twelve people are not one kind of person.
時間、紀錄、數字。這些東西不會說謊，也不需要你們相信任何人。: Times, records, numbers. They don't lie, and they don't ask you to believe anyone.
各位，二十六歲的伊森・蕭，這四年來每天最怕的就是被誤會。: Ladies and gentlemen, Ethan Shaw is twenty-six, and for four years the thing he has feared most, every single day, is being misunderstood.
程序正義: Due process
警方沒有調閱手錶，沒有調閱稽核紀錄。他們選了一個人，然後停止了調查。: The police never pulled the watch. They never pulled the audit log. They picked a man, and then they stopped investigating.
無罪: Not guilty
陪審長站起來。「就第一項罪名，我們認定被告無罪。」: The foreperson stands. "On the first count, we find the defendant not guilty."
伊森的姊姊在旁聽席上哭出聲。伊森看著證人席旁的那張空椅子，沒有看盧卡斯。: Ethan's sister sobs in the gallery. Ethan looks at the empty chair beside the witness stand, not at Lucas.
