name: CI

on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型別檢查
        run: npm run typecheck
      - name: Lint 與格式
        run: npm run lint
      - name: 劇本驗證器
        run: npm run validate:content
      - name: 單元測試
        run: npm test
      - name: 建置
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # 11-13：e2e 單機跑到 41 分鐘（4 核、2 個 worker）。拆成 4 台同時跑，測試一個都不少。
  e2e:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 自動通關測試（第 ${{ matrix.shard }}／4 份）
        env:
          PW_PREBUILT: '1'
          # PR 只跑快速層（第一級組合）；合併到 main 後跑全站掃描（process-v2 第 5 節）。
          E2E_TIER: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --shard=${{ matrix.shard }}/4

  # WebKit 冒煙（第一級支援：中文 100%、桌機 1366、手機 390）：Safari 只有 WebKit，Chromium 測不到。
  # 只跑第 1 集整集通關＋第 2 集每種場景各一次，和 e2e 分片同時跑，不拉長 CI。
  webkit:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: WebKit 冒煙
        env:
          PW_PREBUILT: '1'
        run: |
          npx playwright install --with-deps webkit
          npx playwright test -c playwright.webkit.config.ts
      - name: 失敗時印出畫面快照與截圖（artifact 下載不到時用）
        if: failure()
        run: |
          for f in test-results/*/error-context.md; do echo "=== $f"; cat "$f"; done
          for f in test-results/*/test-failed-1.png; do echo "=== PNG $f"; base64 -w0 "$f"; echo; done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-results
          path: test-results
          retention-days: 7

  # 全路線通關（第 1 集 R1–R7、第 2 集 E1–E11，兩種寬度）：每條約 3–4 分鐘，只在合併後跑。
  routes:
    needs: static
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 全路線通關＋設定集稽核（第 ${{ matrix.shard }}／4 份）
        env:
          PW_PREBUILT: '1'
          # 每個截圖點跑設定集稽核（一格一黃、動態、百分比、紅章、虛線框、黑條），違規就紅。
          BIBLE: '1'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.sweep.config.ts --shard=${{ matrix.shard }}/4

  # 黑底鏡頭層的選單鈕顏色（process-v2 第 5 節第 14 項）：25 個鏡頭層情境逐幀量像素，體驗評測的腳本原樣搬來。
  camera:
    needs: static
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        size: [p7, '1530', '320']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: |
          npx playwright install --with-deps chromium
          # python3 -I 會略過使用者 site-packages，所以裝進 venv 並放到 PATH 最前面
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet numpy pillow
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: 選單鈕顏色（${{ matrix.size }}）
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          qa/gate2/ci-camera.sh "$RUNNER_TEMP/camera" ${{ matrix.size }}

  # 合併保護看的是這個名字：上面全部綠才綠。
  check:
    needs: [static, e2e, webkit, routes, camera]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 全部通過
        run: |
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ] && [ "${{ needs.webkit.result }}" = success ] && [[ "${{ needs.routes.result }}" =~ ^(success|skipped)$ ]] && [[ "${{ needs.camera.result }}" =~ ^(success|skipped)$ ]]

  # 合併後全站掃描紅了：開 Issue（C 級以外由協調者分級），不必等人去看 Actions。
  report:
    needs: [static, e2e, webkit, routes, camera]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create -R "${{ github.repository }}" \
            --title "main 全站掃描失敗：${GITHUB_SHA::7}" \
            --body "合併後的全站掃描在 ${GITHUB_SHA} 失敗：$RUN"
