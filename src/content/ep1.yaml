  # 庭審：柯瓦斯基（教學：異議、彈劾三步驟簡單版）
  - type: trial
    id: court-kowalski
    act: 第四幕
    day: 第一天
    threshold: 70
    patience: 5
    jurors:
      - id: j1
        label: 退休警察
