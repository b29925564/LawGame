可以走了。回家吧，伊森。: You can go. Go home, Ethan.
認罪書上寫的是他做過的事。｜我到現在都不知道，那是不是真的。: The plea says what he did.｜I still don't know if it's true.
碼頭九號。｜十二年前，我父親的那場火。: Pier Nine.｜Twelve years ago. My father's fire.
交給海爾。事務所的事，先問事務所。: Give it to Hale. Firm business goes to the firm first.
自己保留。在知道它是什麼之前，誰都不給。: Keep it. Nobody gets it until I know what it is.
交給潔德。她會知道怎麼讓它見光。: Give it to Jade. She'll know how to get it out.
我知道。: I know.
我沒有說她殺人。｜我只說她說了謊。: I never said she killed him.｜I only said she lied.
我知道她為什麼說謊。: I knew why she lied.
你怎麼知道我在哪裡做事。: How do you know where I work.
謝謝。這個我很擅長。: Thank you. It's one of my strengths.
有窗嗎？: Does it have a window?
沒有。: No.
也好。我怕高。: Good. I'm not great with heights.
22:44 抵達 → 22:47 刷卡: 22:44 drop-off → 22:47 badge-in
訊息可以從兩支手機上收回。通知紀錄不行。: A message can be unsent from either phone. A notification log can't.
一個每天看的人，那支錶裡就一定有東西可以查。: He looks at that watch every day. There's something in it.
