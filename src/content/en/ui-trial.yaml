# UI strings: Courtroom, JuryPanel, JuryLegend, Closing, Theory (and Opening), Defense, VoirDire. Key = Chinese source string exactly.

# Jury panel and legend
陪審團: Jury
顯示數值: Show numbers
'{over} / {total} 傾向{yes}': '{over} / {total} lean toward {yes}'
'數字是每個人的「{lean}」，0 到 100。{n} 以上才會投{yes}，那條線就是「{standard}」。': 'Each number is that juror’s score for “{lean}”, from 0 to 100. At {n} or above they vote {yes}; that line is “{standard}.”'
'目前 {over} / {total} 在線上。': '{over} of {total} are over the line right now.'
原型是從檢方舉證完畢開始，所以一開始所有人都在線上，你要把他們拉下來。: The prototype starts after the prosecution rests, so everyone begins over the line. Your job is to pull them back down.

