name: 部署到 GitHub Pages

# main 每次合併自動部署，給外部試玩者一個固定網址（https://b29925564.github.io/LawGame/）。
# 不擋 PR；Artifact 試玩連結照舊留作里程碑版。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 建置只要讀；寫 Pages 和 OIDC 權杖只給 deploy 工作（#380 S4）。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Pages 還沒啟用（Settings → Pages 的 Source 還不是 GitHub Actions）時，建置和部署都跳過，不算失敗、不寄信。
  # 使用者一選好 GitHub Actions，下一次合併就自動恢復部署。
  enabled:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      on: ${{ steps.check.outputs.on }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$t" = workflow ]; then echo on=true >> "$GITHUB_OUTPUT"; echo 'Pages 已啟用，照常部署'
          else echo on=false >> "$GITHUB_OUTPUT"; echo "Pages 還沒設成 GitHub Actions（${t:-未啟用}），這次跳過部署"; fi

  build:
    needs: enabled
    if: needs.enabled.outputs.on == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 建置（子路徑 /LawGame/）
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
