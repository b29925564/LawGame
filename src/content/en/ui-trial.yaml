開庭前選一個案件理論，論點才有方向。: Pick a case theory before trial so your points have a direction.
結辯基調要對著陪審員的取向挑。: Choose the closing tone for the jurors you actually have.
談判時攤過的牌對方會備好說法，結辯換別的論點。: Cards you showed in negotiation get an answer ready; close on other points.
先鎖定證詞，再出示論點，彈劾才會成立。: Lock the testimony first, then show your point, and the impeachment holds.
開示時硬藏的東西被揭穿，比交出去更傷。: Withholding in discovery hurts more than handing it over once it comes out.
