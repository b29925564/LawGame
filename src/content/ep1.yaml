        text: 好。就這樣吧。
        mood: 緊
      - who: 艾莉絲
        text: 當公設辯護人的時候，我也對另一個委託人說過「這是最好的選擇」。他死在裡面。
        thought: true

  # 第三幕收尾：選案件理論（企劃書 6.9.2）。選了就不能換。
