id: lucas
name: 盧卡斯・葛雷
anchor_en: >-
  a boyish 29-year-old Eurasian man, Taiwanese father and white American mother; softly squared face with a clear jawline, large round puppy-dog eyes with full aegyo-sal and a thin visible double-eyelid crease, steel-blue irises, straight flat dark brows, straight high nose bridge, thin lips, clean-shaven; thick dark brown textured hair with a centre-parted curtain fringe covering the brows, short tapered sides; thin round tortoiseshell glasses
anchor_zh: 一位 29 歲、少年感的台裔與白人混血男性；柔和方圓臉、下顎線清晰，偏圓的狗狗眼、臥蠶飽滿、薄雙眼皮，鋼藍色眼珠，平直深色眉毛，鼻樑直而高，薄唇，不留鬍渣；深棕色厚髮、中分碎蓋瀏海蓋到眉毛、兩側收短；細圓框玳瑁眼鏡
face_ref: ../../../lucas_final.png      # 2026-10-02 定案（= candidates/lucas_c5.png），不再重抽
wardrobe_en: charcoal wool single-breasted suit, ivory cotton shirt open at the collar, no tie
accessories_en: a worn brown leather-strap wristwatch on the left wrist; thin round tortoiseshell glasses
skin_tier: null                 # 膚色階待第 2 章定
# 對齊基準（2048×2560 原檔）：頭頂 y=58、頭部中心 x=933、頭寬 1099；全組照此對齊，可直接交叉淡化
align: { head_top: 58, head_cx: 933, head_w: 1099 }
tool: 線上對話式生圖工具（使用者操作），以 lucas_final.png 當參考、逐句修改指令產生
date: 2026-10-02
process: [裁 4:5, Lanczos 放大至 2048×2560, rembg isnet-general-use 去背, 依頭頂與頭寬對齊, WebP q70 輸出 1024/512/144]
default: { plain: v01, tense: tense-light v01, hard: v01, warm: v01, panic: v01, silent: v02 }
# 使用者 17:36Z 更正：原記為緊的 v02/v03 其實是硬；硬目前瀏海仍放下，露額頭版尚未產生
picks:
  - { file: lucas__F__plain__v01.webp,        expr: plain,  role: default,  framing: standard }
  - { file: lucas__F__hard__v01.webp,         expr: hard,   role: default,  framing: standard, note: 眉壓最實；瀏海放下版 }
  - { file: lucas__F__hard__v02.webp,         expr: hard,   role: alt,      framing: standard }
  - { file: lucas__F__tense__v01.webp,        expr: tense,  role: alt,      framing: tight,    note: 緊（重）；只適合頭像尺寸 }
  - { file: lucas__F__tense-light__v01.webp,  expr: tense,  role: default,  framing: standard, note: 緊（輕）；標準構圖裡唯一的緊，先當預設 }
  - { file: lucas__F__tense-camera__v01.webp, expr: tense,  role: camera,   framing: standard, note: 直視鏡頭；玩家做出令人疑惑的選擇時出現 }
  - { file: lucas__F__warm__v01.webp,         expr: warm,   role: default,  framing: standard, note: 含蓄微笑 }
  - { file: lucas__F__warm__v02.webp,         expr: warm,   role: big,      framing: standard, note: 真心笑（露齒） }
  - { file: lucas__F__warm__v03.webp,         expr: warm,   role: alt,      framing: standard }
  - { file: lucas__F__warm__v04.webp,         expr: warm,   role: alt,      framing: standard }
  - { file: lucas__F__panic__v01.webp,        expr: panic,  role: default,  framing: standard, note: 眼睛睜最大 }
  - { file: lucas__F__panic__v02.webp,        expr: panic,  role: alt,      framing: standard }
  - { file: lucas__F__panic__v03.webp,        expr: panic,  role: alt,      framing: tight,    note: 視線閃最明顯；只適合頭像尺寸 }
  - { file: lucas__F__silent__v01.webp,       expr: silent, role: alt,      framing: standard }
  - { file: lucas__F__silent__v02.webp,       expr: silent, role: default,  framing: standard }
  - { file: lucas__F__silent__v03.webp,       expr: silent, role: heavy,    framing: tight,    note: 側臉低頭最重；重場面；只適合頭像尺寸 }
