        label: 貨運司機
        leans: [權威]
        start: 54
      - id: j8
        label: 高中老師
        leans: [程序, 情感]
        start: 48
      - id: j9
        label: 保險理賠員
        leans: [邏輯]
        start: 52
      - id: j10
        label: 麵包店老闆
        leans: [情感]
        start: 50
      - id: j11
        label: 圖書館員
        leans: [程序]
        start: 47
      - id: j12
        label: 建築工地領班
        leans: [權威, 情感]
        start: 55
    intro:
      - who: 羅根
        text: 檢方直接詰問的時候，每個問題妳都有一次異議的機會。理由錯了，法官的耐心就少一格。
        mood: 硬
      - who: 艾莉絲
        text: 五格耐心。用完之前，我得讓陪審團知道這個警探沒查什麼。
        thought: true
    witness:
      name: 柯瓦斯基
      role: 重案組警探・服務 22 年
      direct:
        - id: d1
          q: 警探，請說明您到達現場時看到的情況。
          a: 死者倒在辦公桌旁，頭部有重擊傷。桌上的水晶獎盃掉在地毯上，上面有血。
          impact: 4
          tags: [權威]
        - id: d2
          q: 門禁紀錄顯示被告 22:47 上樓。這代表他在案發時間在場，對不對？
          a: 對，這正是我們鎖定他的原因。
          objection: 誘導
          sustained: 異議成立。檢察官，請不要把答案放進問題裡。
          impact: 5
          tags: [邏輯, 權威]
        - id: d3
          q: 大樓警衛跟您說，他看到被告驚慌地跑出大廳，是嗎？
          a: 警衛是這樣告訴我的。
          objection: 傳聞
          sustained: 異議成立。警衛本人可以自己來作證。
          impact: 5
          tags: [情感]
        - id: d4
          q: 以您二十二年的辦案經驗，被告當時的心裡在想什麼？
          a: 一個剛犯下重罪的人會想的事：離開現場。
          objection: 推測
          sustained: 異議成立。證人不是被告肚子裡的蛔蟲。
          impact: 4
          tags: [權威, 情感]
        - id: d5
          q: 被告四年前也曾經被逮捕，您知道嗎？
          a: 我調過他的紀錄，持有毒品。
          objection: 無關
          sustained: 異議成立。陪審團請忽略這個問題。檢察官，妳很清楚不能這樣問。
          impact: 6
          tags: [情感, 權威]
        - id: d6
          q: 警探，逮捕當天，被告在警車上說了什麼？
          a: 他自己開口說：「我只是想讓他住手。」沒有人問他任何問題。
          impact: 8
          tags: [情感, 權威]
      claims:
        - id: c-checked
          text: 我們檢查了所有跟被告有關的證據。
          argument: arg-a
          needs: watch-notice
          lock:
            strong:
              q: 警探，「所有」是指所有。您是不是要告訴陪審團，這個案子裡沒有一樣東西您沒查？
              a: 我是說，該查的我們都查了。凶器、門禁、指紋、血跡，全部。
            weak:
              q: 你們大概都查過了吧？
              a: 我們查了該查的東西。案發現場能採的都採了。
          setup:
            q: 在那之前先請教一個常識問題：智慧手錶會同步手機的通知，這一點您同意嗎？
            a: ……會。這是常識。
          confront:
            strong: （很長的停頓）那則通知……我沒有看過。被告的手機裡沒有那則訊息，所以我們沒有再往下查。
            weak: 我說的是該查的都查了。手錶那種東西，我們通常不會特別去調。
          counter:
            argument: arg-a
            text: 異議。那則通知預覽也可能是被告自己用別的帳號傳給自己的。
            needs: chat-audit
            broken: 庭上，稽核紀錄顯示發送裝置是死者辦公室的桌機，不是被告的手機。
            failed: 庭上……我手上沒有能證明是誰傳的東西。
      irrelevant:
        - q: 警探，您辦過多少件命案？
          a: 加上這件，一百一十七件。
        - q: 您是什麼時候決定被告就是兇手的？
          a: 我沒有「決定」，我是依證據辦案。
      breakdown: （陪審席上，那位軟體工程師放下了筆，看著證人席。）
    outro:
      - who: 旁白
        text: 法官宣布休庭。走廊上，莫羅檢察官從後面追上來。
      - who: 莫羅
        text: 韓律師。過失致死，緩刑五年。這是我最後的條件。
      - who: 艾莉絲
        text: 她在庭上從來不追人講話。她開始怕了。
        thought: true

