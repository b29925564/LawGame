name: CI

on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型別檢查
        run: npm run typecheck
      - name: Lint 與格式
        run: npm run lint
      - name: 劇本驗證器
        run: npm run validate:content
      - name: 單元測試
        run: npm test
      - name: 建置
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # 11-13：e2e 單機跑到 41 分鐘（4 核、2 個 worker）。拆成 4 台同時跑，測試一個都不少。
  e2e:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 自動通關測試（第 ${{ matrix.shard }}／4 份）
        env:
          PW_PREBUILT: '1'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --shard=${{ matrix.shard }}/4

  # 合併保護看的是這個名字：上面全部綠才綠。
  check:
    needs: [static, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 全部通過
        run: |
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ]
