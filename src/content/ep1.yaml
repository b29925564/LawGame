            text: 清單上沒有這個人。妳在虛張聲勢，而且我記住了。
            mood: 硬
    reveals:
      - who: 凱瑟琳・莫羅
        text: ……讓我看一下。
        mood: 硬
    walkOut:
      - who: 凱瑟琳・莫羅
        text: 那就法庭見。我的條件在開庭前會回到原點。
        mood: 硬
    accepted:
