scenes:
  # 冷開場（企劃書 10.7）：玩家拿著伊森的手機，親眼看過那則之後被收回的訊息。
  # 字卡只寫鏡頭拍得到的東西，不替伊森解釋心理；為什麼不報警，留到第一幕由他自己回答。
  - type: phone
    id: cold-open
    act: 冷開場
    owner: 伊森
    steps:
      - do: caption
        time: '22:31'
        text: 週五深夜，卡爾德大樓 31 樓，財務長辦公室亮著燈。一台沒登出的電腦前，有人打了一行字。
      - do: caption
        time: '22:33'
        text: 城東一間小公寓。伊森・蕭坐在床邊，筆電上開著一份文件：〈給稽核部的說明_v3〉。游標停在第一行。
      - do: notify
        time: '22:33'
        message:
          id: summons
          from: 葛蘭特・沃斯
          text: 十點四十五分上來，把筆電帶來。我們私下解決。
      - do: choose
        mode: chat
        options:
          - text: 好。
          - text: 我馬上到。
          - text: 現在？您還在公司？
      - do: ride
        time: '22:34'
        from: 家・東河街 118 號
        to: 卡爾德大樓
        driver: 奧瑪・H
      - do: talk
        time: '22:38'
        who: 奧瑪
        text: 這時間還進城？加班啊？
      - do: choose
        mode: talk
        options:
          - text: 老闆說要私下解決。也許……我不會被開除了。
            then:
              - who: 奧瑪
                text: 那是好事啊。祝你好運，老弟。
          - text: 嗯，算是吧。
            then:
              - who: 奧瑪
                text: 放輕鬆啦，老弟。你那支手機快被你捏碎了。
              - who: 伊森
                text: 老闆說要私下解決。也許……我不會被開除了。
              - who: 奧瑪
                text: 那很好啊。祝你好運。
      - do: talk
        time: '22:44'
        who: 奧瑪
        text: 卡爾德大樓到了。
      - do: badge
        time: '22:47'
        place: 卡爾德大樓・31F 電梯廳
      - do: door
        text: 走廊只剩緊急照明。財務長辦公室的門虛掩著，裡面沒有聲音。
        action: 推開門
      - do: caption
        time: '22:49'
        text: 沃斯倒在辦公桌旁的地毯上。伊森跪下去摸他的脖子，摸不到脈搏。他站起來的時候，袖口沾了血，手裡多了一座水晶獎盃。
      - do: caption
        time: '23:01'
        text: 大廳閘門。他拿出手機，按了 9，按了 1，又把手機收回口袋。
      - do: caption
        time: '23:14'
        text: 港邊的公車亭。他打開聊天室，往上滑，找沃斯那則訊息。
      - do: retract
        time: '23:14'
        target: summons
      - do: caption
        time: '23:14'
        text: 公車進站，又開走了。伊森沒有上車。

  - type: card
    id: title
    act: 片頭
    title: 合理懷疑
    lines:
      - 第一集　已收回的訊息

  # 第一幕：接案（企劃書 10.7）
  # 銅牌上「海爾」底下的新漆是第一季的伏筆（企劃書 7.2：那裡原本寫著「索恩」），只拍不說。
  - type: dialogue
    id: firm-morning
    act: 第一幕
    place: 惠特洛克・海爾律師事務所　大廳　週一 08:00
    steps:
      - do: say
        who: 旁白
        text: 港灣大道一號，頂樓。接待櫃台後的銅牌寫著「惠特洛克・海爾」。「海爾」兩個字底下的漆，比旁邊新。
      - do: say
        who: 馬庫斯・海爾
        text: 韓律師，歡迎。四年公設辯護人，兩百多件案子。
        mood: 暖
      - do: say
        who: 馬庫斯・海爾
        text: 我挖妳過來，不是看妳履歷漂亮，是看妳輸得起。
        mood: 暖
      - do: say
        who: 艾莉絲
        text: 我還以為是因為我贏過幾場。
      - do: say
        who: 馬庫斯・海爾
        text: 贏過幾場的人，這層樓到處都是。輸了還肯回頭查到底的，不多。
        mood: 暖
      - do: say
        who: 維多莉亞・惠特洛克
        text: 韓律師。我們最大的客戶卡爾德物流，週末出了點事。這陣子在外面提到他們，請謹慎。
        mood: 硬
      - do: say
        who: 羅根・普萊斯
        text: 他們的財務長週五晚上死在辦公室裡。警方昨天抓到人了。
      - do: say
        who: 維多莉亞・惠特洛克
        text: 羅根。
        mood: 硬
      - do: say
        who: 羅根・普萊斯
        text: 羅根・普萊斯。妳的辦公室在走廊盡頭，影印機旁邊那間。
        mood: 硬
      - do: say
        who: 艾莉絲
        text: 影印機旁邊，消息最多。
      - do: say
        who: 旁白
        text: 09:40，桌上的電話亮起。來電顯示：卡爾德港看守所。

  - type: dialogue
    id: jail-call
    act: 第一幕
    place: 艾莉絲的辦公室　週一 09:40
    steps:
      - do: say
        who: 語音
        text: 您有一通來自卡爾德港看守所的電話。本通話將被錄音。接聽請按 1。
      - do: say
        who: 伊森
        text: 艾莉絲？是我，伊森・蕭。四年前……妳當過我的公設辯護人。對不起，我只背得出妳的號碼。
        mood: 緊
      - do: say
        who: 艾莉絲
        text: 我記得你。伊森，發生什麼事？
      - do: say
        who: 伊森
        text: 是他叫我上去的。我發誓，是他叫我上去的。
        mood: 緊
      - do: choose
        prompt: 先問他什麼？
        options:
          - text: 慢慢說。從你收到訊息開始。
            then:
              - who: 伊森
                text: 好。好。……十點半多一點，他傳訊息給我，叫我——
                mood: 緊
              - who: 艾莉絲
                text: 等一下。這支電話有錄音。
          - text: 你跟警察說過什麼嗎？
            then:
              - who: 伊森
                text: 在警車上，他們一直問、一直問……我就說，我只是想讓他住手。我是說，讓他別再誣賴我——
                mood: 緊
              - who: 艾莉絲
                text: 伊森，停。這支電話有錄音。
      - do: say
        who: 艾莉絲
        text: 下午我過去看你。在那之前，誰問你都別開口，包括同房的人。

  # 教學：訪談（企劃書 10.10，由艾莉絲的心聲提示；說成她對伊森的直覺，不寫成規則）
  - type: interview
    id: meet-ethan
    act: 第一幕
    who: 伊森・蕭
    role: 委託人・26 歲・財務分析師
    via: 看守所視訊會見室
    meter:
      label: 不安
      start: 2
      max: 5
    intro:
      - who: 伊森
        text: 他們說我逃了兩天。我不是逃，我只是……不知道還能去哪。
        mood: 緊
      - who: 艾莉絲
        text: 還沒人問，他就先替自己辯護了。先讓他講，難聽的晚點再問。
        thought: true
    topics:
      - id: t-friday
        label: 星期五下午，沃斯找你做什麼？
        key: true
        lines:
          - who: 伊森
            text: 他說帳上少了錢，是我拿的。星期一要叫保全把我請出去，然後報警。
            mood: 緊
          - who: 伊森
            text: 我出門的時候回頭吼了一句：「等稽核報告出來，你會後悔的。」門外有人聽到。
        gives: [ethan-accused]
      - id: t-ride
        label: 那天晚上你怎麼去公司的？
        key: true
        lines:
          - who: 伊森
            text: 叫車。我沒車。司機是個中年大叔，一路上都在跟我聊天。
          - who: 艾莉絲
            text: 幾點上車？
          - who: 伊森
            text: 十點半過一點……三十四？三十五？我不確定。手機被收走了，沒辦法查。
            mood: 緊
        gives: [ethan-ride]
      - id: t-message
        label: 他傳給你的訊息，還在嗎？
        key: true
        lines:
          - who: 伊森
            text: 不見了。我在公車亭想再看一次，只剩一行「此訊息已被收回」。
            mood: 緊
          - who: 伊森
            text: 我知道，聽起來像我編的。可是那時候手錶有震，我低頭看了，那句話就在錶面上。
        gives: [ethan-message]
      - id: t-flee
        label: 你為什麼跑？
        guard: 1
        lines:
          - who: 伊森
            text: 因為我有前科。
            mood: 緊
          - who: 伊森
            text: 警察查到我的名字，就不會再去查別人了。妳看過他們怎麼對我的。
        gives: [ethan-flee]
      - id: t-report
        label: 你說的稽核報告，是什麼意思？
        needs: [ethan-accused]
        lines:
          - who: 伊森
            text: 禮拜三，我匿名檢舉了一筆應收帳款。三千八百萬美金，掛在一家叫北門貨運的公司下面。
          - who: 伊森
            text: 我查過。北門貨運沒有倉庫，沒有車，只有一個信箱地址。
          - who: 艾莉絲
            text: 這件事，你還跟誰說過？
          - who: 伊森
            text: 沒有。系統是匿名的。它會給一個編號……我背得出來。
        gives: [ethan-report]
    press:
      - id: p-trophy
        label: 你為什麼會握著那座獎盃？
        needs: ethan-flee
        lines:
          - who: 伊森
            text: 我不知道。我真的不知道。我蹲下去摸他脖子，站起來的時候，它就在我手上了。
            mood: 緊
          - who: 伊森
