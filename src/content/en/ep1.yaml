陪審長站起來。「庭上，我們無法達成一致的評決。」: The foreperson stands. "Your Honor, we are unable to reach a unanimous verdict."
法官宣布審判無效。莫羅檢察官在座位上看著卷宗，很久沒有動。: The judge declares a mistrial. Prosecutor Morrow sits looking at her file for a long time without moving.
三天後，檢察署送來一頁公文：本案不再重新審理。: 'Three days later, a one-page notice arrives from the District Attorney: the case will not be retried.'
（電話）手錶、聊天紀錄，換十二個人也一樣。我不拿同一副牌再打一次。: (Phone) The watch, the chat logs. Twelve different people would see the same thing. I don't play the same hand twice.
所以……我不用再回去了？不用了，對吧？: So... I don't have to go back? I don't, right?
