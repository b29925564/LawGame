      - id: c-farmer
        name: 厄爾・強森
        job: 農產批發
        sheet: 六十歲，家族生意。
        leans: [權威]
        start: 57
        lead: 5
        value: 3
        question:
          q: 您對律師的印象怎麼樣？
          a: 你們就是靠把黑的說成白的賺錢。
        hidden: 明確表示對辯護律師有偏見。
        cause: true
      - id: c-dj
        name: 凱・布萊克
