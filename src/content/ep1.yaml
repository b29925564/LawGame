        label: 故意殺人，八年
        lines:
          - who: 黛安娜・莫羅
            text: 故意殺人，八年。妳的那些東西還不足以讓陪審團轉向。
            mood: 硬
        asks:
          - who: 伊森・里維拉
            text: 八年還是八年。妳覺得我該接受嗎？
            mood: 緊
      - id: o-negligent
        min: 40
        label: 過失致死，三年
        lines:
          - who: 黛安娜・莫羅
            text: 過失致死，三年。妳讓我有點不舒服了，韓律師。
            mood: 硬
        asks:
          - who: 伊森・里維拉
            text: 三年。我姊說她可以等。妳覺得呢？
            mood: 緊
      - id: o-probation
        min: 0
        label: 過失致死，緩刑五年
        lines:
          - who: 黛安娜・莫羅
            text: 過失致死，緩刑五年。他明天就能回家。但我不會撤回起訴——我有目擊證人。
            mood: 硬
        asks:
          - who: 伊森・里維拉
            text: 明天就能回家。可是我這輩子都是殺人犯了。妳覺得我該接受嗎？
            mood: 緊
    disclosed: [autopsy, watch-photo, ride-receipt, watch-notice, indictment, blood-report]
    bluffs:
      - id: b-time
        label: 我有辦法證明沃斯在伊森進門前就死了。
        needs: [autopsy, watch-photo]
        strength: 20
        believed:
          - who: 黛安娜・莫羅
            text: 手錶。……妳拿到那支手錶的資料了。
            mood: 硬
        caught:
          - who: 黛安娜・莫羅
            text: 妳開示給我的清單裡沒有那種東西。別在我這裡唬人，韓律師。
            mood: 硬
      - id: b-witness
        label: 我有人可以證明妳的證人整晚不在座位上。
        needs: [meeting-name]
        strength: 25
        believed:
          - who: 黛安娜・莫羅
            text: 誰？
            mood: 硬
        caught:
          - who: 黛安娜・莫羅
            text: 清單上沒有這個人。妳在虛張聲勢，而且我記住了。
            mood: 硬
    reveals:
      - who: 黛安娜・莫羅
        text: ……讓我看一下。
        mood: 硬
    walkOut:
      - who: 黛安娜・莫羅
        text: 那就法庭見。我的條件在開庭前會回到原點。
        mood: 硬
      - who: 艾莉絲
        text: 我知道。我也知道我為什麼不能替他決定。
        thought: true
    accepted:
      - who: 伊森・里維拉
        text: 好。就這樣吧。
        mood: 緊
      - who: 艾莉絲
        text: 十二年前我也對另一個人說過「這是最好的選擇」。他死在裡面。
        thought: true

