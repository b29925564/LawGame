        sheet: 二十四歲，兼職讀夜校。
        leans: [情感]
        start: 47
        lead: 1
        value: 6
        question:
          q: 您覺得被起訴的人，通常是不是真的做了？
          a: 不知道欸。我沒想過這個。
      - id: c-broker
        name: 西奧・岡薩雷斯
        job: 保險經紀
        sheet: 自營，十年。
        leans: [邏輯, 權威]
        start: 55
        lead: 4
        value: 3
        question:
          q: 有人跑掉了，您會怎麼想？
          a: 心虛才跑。我做保險，看太多了。
        hidden: 明確表示逃跑等於心虛。
        cause: true
      - id: c-chef
        name: 瑪雅・托雷斯
        job: 餐廳主廚
        sheet: 自己開店七年。
        leans: [情感]
        start: 49
        lead: 3
        value: 6
        question:
          q: 廚房出事的時候，您會先怪誰？
          a: 先看流程哪裡壞掉，不是先找人。
      - id: c-clerk
        name: 亞當・費爾南德斯
        job: 郵局櫃檯
        sheet: 公務員，十八年。
        leans: [程序]
        start: 51
        lead: 2
        value: 5
        question:
          q: 規定和常識衝突的時候，您聽哪一個？
          a: 規定。規定就是大家講好的常識。
      - id: c-retail
        name: 珍妮・吳
        job: 服飾店副理
        sheet: 三十五歲，已婚。
        leans: [情感, 邏輯]
        start: 50
        lead: 3
        value: 5
        question:
          q: 監視器畫面和店員的說法不一樣，您信哪邊？
