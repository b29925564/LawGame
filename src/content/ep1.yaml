        mood: 暖
      - who: 馬庫斯・海爾
        text: 但妳問什麼，對面就知道妳往哪裡查。問到痛處，他們開庭前就補好了。
        mood: 暖
      - who: 馬庫斯・海爾
        text: 所以問些不痛不癢的，讓她把話講死。真正的武器，留到法庭上。
        mood: 暖
    outro:
      - who: 瑞秋・艾德勒
        text: 還有事嗎？我十一點有會。
        mood: 硬
    topics:
      - id: d-night
        label: 那天晚上
        questions:
          - id: d-heard
            q: 妳說妳聽見隔壁有人倒地。那是幾點？
            a: 十點五十分。我看了螢幕右下角的時間。
            anchors: rachel-2250
          - id: d-after
            q: 聽見之後妳做了什麼？
            a: 我以為是東西倒了。我繼續開我的會。
          - id: d-leave
            q: 妳幾點離開公司？
            a: 十一點半過後吧。保全紀錄上有。
      - id: d-meeting
        label: 那場會議
        questions:
          - id: d-online
            q: 妳說妳整晚都在線上會議裡，中間有離開過嗎？
            a: 沒有。二十一點到二十三點半，我一直在座位上。
            anchors: rachel-meeting
          - id: d-who
            q: 那場會議叫什麼名字？
            a: 北門結案會議。這跟本案有關係嗎？
            gives: [meeting-name]
            objection: 與本案無關
          - id: d-camera
            q: 會議全程開著鏡頭嗎？
            a: 我不記得了。
      - id: d-cards
        label: 妳手上的牌
        questions:
          - id: d-watch
            q: 沃斯那支手錶的健康資料，妳知道裡面有什麼嗎？
            a: 我為什麼要知道他手錶裡有什麼？
            tips: [arg-b]
            objection: 推測
          - id: d-chat
            q: 公司的聊天系統，訊息收回之後還留得下紀錄嗎？
            a: 那要問資訊部。我不碰那些。
            tips: [arg-a]
          - id: d-31f
            q: 二十三點十四分的時候，三十一樓還有誰？
            a: 我不知道。我在自己的房間裡。
            tips: [arg-d]
      - id: d-person
        label: 她這個人
        questions:
          - id: d-role
            q: 妳在卡爾德物流負責什麼？
            a: 合規。所有帳目最後都要過我這一關。
          - id: d-voss
            q: 妳和沃斯共事多久了？
            a: 九年。他找我進來的。
          - id: d-audit
            q: 公司內部有匿名檢舉系統嗎？
            a: 有。收件的是稽核，不是我。
            objection: 與本案無關
          - id: d-northgate
            q: 北門貨運這家公司，妳聽過嗎？
            a: ……那是我們的承攬商之一。很多家。
            tips: [arg-c]
          - id: d-ethan
            q: 妳認識伊森・蕭嗎？
            a: 見過。分析師，沃斯很欣賞他。
          - id: d-blood
            q: 那天晚上妳有看到任何人離開三十一樓嗎？
            a: 沒有。我說過了，我在自己的房間裡。
            anchors: rachel-2250

  # 第三幕之三：認罪協商（教學：談判、虛張聲勢、委託人才有決定權）
