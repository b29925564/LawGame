        mood: 暖
      - who: 馬庫斯・海爾
        text: 還有，決定妳要對誰說話。十二個人不是同一種人。
        mood: 暖
      - who: 艾莉絲
        text: 我不打算說伊森是好人。我要讓他們看到另一種可能。
    tones:
      - id: t-logic
        label: 邏輯
        tag: 邏輯
        text: 時間、紀錄、數字。這些東西不會說謊，也不需要你們相信任何人。
      - id: t-feel
        label: 情感
        tag: 情感
        text: 各位，二十六歲的伊森・蕭，這四年來每天最怕的就是被誤會。
      - id: t-due
        label: 程序正義
        tag: 程序
        text: 警方沒有調閱手錶，沒有調閱稽核紀錄。他們選了一個人，然後停止了調查。
    endings:
      - id: scapegoat
        when:
          verdict: [無罪]
          theory: [sophie]
        lines:
          - who: 旁白
            text: 陪審長站起來。「就第一項罪名，我們認定被告無罪。」
          - who: 旁白
            text: 伊森的姊姊在旁聽席上哭出聲。伊森看著證人席旁的那張空椅子，沒有看艾莉絲。
      # E3：陪審團僵局，但論點 A、B 都在庭上講過，檢方放棄重審（企劃書 10.9）。
      - id: retrial-dropped
