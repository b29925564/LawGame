  # 結辯與判決（企劃書 6.9.8、6.10）
  - type: closing
    id: closing
    act: 第四幕
    place: 卡爾德港高等法院　第三法庭
    picks: 3
    threshold: 70
    intro:
      - who: 馬可仕・海爾
        text: 挑三個。講最後的那一個，他們記得最清楚。
        mood: 暖
      - who: 馬可仕・海爾
        text: 還有，決定妳要對誰說話。十二個人不是同一種人。
        mood: 暖
      - who: 艾莉絲
        text: 我不打算說伊森是好人。我要說的是，這件事還有另一種可能。
        thought: true
    tones:
      - id: t-logic
        label: 邏輯
        tag: 邏輯
        text: 時間、紀錄、數字。這些東西不會說謊，也不需要你們相信任何人。
      - id: t-feel
        label: 情感
        tag: 情感
        text: 各位，二十六歲的伊森・里維拉，這兩年來每天最怕的就是被誤會。
      - id: t-due
        label: 程序正義
        tag: 程序
        text: 警方沒有調閱手錶，沒有調閱稽核紀錄。他們選了一個人，然後停止了調查。
    verdicts:
      無罪:
