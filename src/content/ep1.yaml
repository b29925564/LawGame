          impact: 2
          tags: [權威]
        - id: r2
          q: 案發當晚，您在三十一樓，是嗎？
          a: 是。我在自己的辦公室裡開線上會議。
          impact: 3
          tags: [權威]
        - id: r3
          q: 您聽見了什麼？
          a: 十點五十分左右，隔壁房間有很重的一聲，像是有人倒下去。
