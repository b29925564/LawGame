scenes:
  # 冷開場（企劃書 10.7）：玩家拿著伊森的手機，親眼看過那則之後被收回的訊息。
  - type: phone
    id: cold-open
    act: 冷開場
    owner: 伊森
    steps:
      - do: caption
        time: '22:31'
        text: 週五深夜。卡爾德大樓 31 樓，財務長辦公室的燈還亮著。有人坐在一台還登入著的電腦前，打了一行字。
      - do: caption
        time: '22:33'
        text: 城東一間小公寓。伊森・蕭坐在床邊，第三次重寫給稽核部門的信。下午，財務長沃斯指控他盜用公款，說星期一會讓保全帶他離開。
      - do: notify
        time: '22:33'
        message:
          id: summons
          from: 葛蘭特・沃斯
          text: 十點四十五分上來，把筆電帶來。我們私下解決。
      - do: choose
        mode: chat
        options:
          - text: 好。
          - text: 我馬上到。
          - text: 現在？您還在公司？
      - do: ride
        time: '22:34'
        from: 家・東河街 118 號
        to: 卡爾德大樓
        driver: 奧瑪・H
      - do: talk
        time: '22:38'
        who: 奧瑪
        text: 這麼晚還要進城？加班喔？
      - do: choose
        mode: talk
        options:
          - text: 老闆說要私下解決。也許……我不會被開除了。
            then:
              - who: 奧瑪
                text: 那是好事啊。祝你好運，老弟。
          - text: 嗯，算是吧。
            then:
              - who: 奧瑪
                text: 你抓著手機的樣子不像要去加班，比較像要去見法官。
              - who: 伊森
                text: 老闆說要私下解決。也許……我不會被開除了。
              - who: 奧瑪
                text: 那就好。祝你好運，老弟。
      - do: talk
        time: '22:44'
        who: 奧瑪
        text: 卡爾德大樓到了。
      - do: badge
        time: '22:47'
        place: 卡爾德大樓・31F 電梯廳
      - do: door
        text: 走廊只剩緊急照明。財務長辦公室的門半掩著，裡面很安靜。
        action: 推開門
      - do: caption
        time: '22:49'
        text: 沃斯倒在辦公桌旁的地毯上。伊森後來只記得三件事：摸不到的脈搏、袖口上的血，還有那座水晶獎盃，不知道為什麼握在自己手裡。
      - do: caption
        time: '23:01'
        text: 大廳閘門。他沒有報警。四年前那一次，他就知道警察會怎麼看他這種人。
      - do: caption
        time: '23:14'
        text: 港邊的公車亭。伊森的手還在發抖。他打開聊天室，想再看一次那則訊息。
      - do: retract
        time: '23:14'
        target: summons
      - do: caption
        time: '23:14'
        text: 那則訊息不見了。他親眼看過的東西，現在只剩你記得。

  - type: card
    id: title
    act: 片頭
    title: 合理懷疑
    lines:
      - 第一集　已收回的訊息

  # 第一幕：接案（企劃書 10.7）
  - type: dialogue
    id: firm-morning
    act: 第一幕
    place: 惠特洛克・海爾律師事務所　大廳　週一 08:00
    steps:
      - do: say
        who: 旁白
        text: 銅牌上「惠特洛克」的字比「海爾」舊，漆色也深一點。海爾是後來才被刻上去的。
      - do: say
        who: 艾莉絲
        text: 六年公設辯護人，兩百多件案子，換來這塊銅牌上一個還沒刻上去的名字。
        thought: true
      - do: say
        who: 馬可仕・海爾
        text: 韓律師。歡迎。我把妳挖來，不是因為妳的履歷漂亮，是因為妳輸得起。
        mood: 暖
      - do: say
        who: 艾莉絲
        text: 我比較希望是因為我贏過幾次。
      - do: say
        who: 馬可仕・海爾
        text: 贏過幾次的人這裡有的是。肯在明知會輸的案子上花力氣的人，我只認識妳一個。
        mood: 暖
      - do: say
        who: 薇薇安・惠特洛克
        text: 韓律師，第一天。我只說一件事：卡爾德物流是這間事務所最大的客戶，請謹慎。
        mood: 硬
      - do: say
        who: 羅根・皮爾斯
        text: 羅根・皮爾斯，五年級。妳的辦公室在走廊底，影印機旁邊那間。
        mood: 硬
      - do: say
        who: 艾莉絲
        text: 他講「影印機旁邊」的時候笑了一下。記下來。
        thought: true
      - do: say
        who: 旁白
        text: 09:40，桌上的電話亮起。來電顯示：卡爾德港看守所。

  - type: dialogue
    id: jail-call
    act: 第一幕
    place: 艾莉絲的辦公室　週一 09:40
    steps:
      - do: say
        who: 語音
        text: 本通話來自卡爾德港看守所，將被錄音。您是否接受？
      - do: say
        who: 伊森
        text: 艾莉絲……是他叫我上去的。我發誓，是他叫我上去的。
        mood: 緊
      - do: say
        who: 艾莉絲
        text: 四年前那通電話，他也是這個聲音。那次他說的是實話。
        thought: true
      - do: choose
        prompt: 你要先跟他說什麼？
        options:
          - text: 慢慢說。從你收到訊息開始。
            then:
              - who: 伊森
                text: 好。好。……十點半多一點，他傳訊息給我。
                mood: 緊
          - text: 你有沒有跟警察說過任何話？
            then:
              - who: 伊森
                text: 在車上……我說我只是想讓他住手。我是說我想讓他別再誣賴我。
                mood: 緊
              - who: 艾莉絲
                text: 那句話現在是檢方手上最好的一張牌。
                thought: true
      - do: say
        who: 艾莉絲
        text: 下午我過去看你。在那之前，一個字都不要跟任何人說。

  # 教學：訪談（企劃書 10.10）
  - type: interview
    id: meet-ethan
    act: 第一幕
    who: 伊森・蕭
    role: 委託人・26 歲・財務分析師
    via: 看守所視訊會見室
    meter:
      label: 不安
      start: 2
      max: 5
    intro:
      - who: 艾莉絲
        text: 問話有三件事要記得：先讓他說完，再問細節，最後才問他不想講的。
        thought: true
      - who: 伊森
        text: 他們說我逃亡兩天。我不是逃亡，我只是……不知道能去哪裡。
        mood: 緊
    topics:
      - id: t-friday
        label: 星期五下午，沃斯找你做什麼？
        key: true
        lines:
          - who: 伊森
            text: 他說帳上少了錢，說是我做的。他說星期一會請保全帶我出去，然後報警。
            mood: 緊
          - who: 伊森
            text: 我走出去的時候喊了一句「等稽核報告出來，你會後悔的」。門外有人聽到。
        gives: [ethan-accused]
      - id: t-ride
        label: 那天晚上你怎麼去公司的？
        key: true
        lines:
          - who: 伊森
            text: 叫車。我沒有車。司機是個中年男的，話很多。我還跟他講了話。
          - who: 艾莉絲
            text: 叫車就有紀錄。上車時間、下車時間，都在別人的伺服器上。
            thought: true
        gives: [ethan-ride]
      - id: t-message
        label: 他傳給你的訊息，還在嗎？
        key: true
        lines:
          - who: 伊森
            text: 不見了。我在公車亭想再看一次，變成「此訊息已被收回」。
            mood: 緊
          - who: 伊森
            text: 我知道這聽起來像什麼。但我的手錶有跳通知，手錶上的東西不會不見吧？
        gives: [ethan-message]
      - id: t-flee
        label: 你為什麼跑？
        guard: 1
        lines:
          - who: 伊森
            text: 因為我有前科。因為四年前他們也是先抓人再問。
            mood: 緊
          - who: 伊森
            text: 那時候是妳幫我的。妳知道他們怎麼看我這種人。
        gives: [ethan-flee]
      - id: t-report
        label: 你說的稽核報告，是什麼意思？
        needs: [ethan-accused]
        lines:
          - who: 伊森
            text: 我禮拜三用匿名系統檢舉過一筆應收帳款，三千八百萬，掛在一家叫北門貨運的公司名下。
          - who: 伊森
            text: 系統會給編號。我記得編號。
        gives: [ethan-report]
    press:
      - id: p-trophy
        label: 你為什麼會握著那座獎盃？
        needs: ethan-flee
        lines:
          - who: 伊森
            text: 我不知道。我真的不知道。我蹲下去摸他脖子，站起來的時候它就在我手上。
            mood: 緊
          - who: 伊森
            text: 妳相信我嗎？……妳如果不信，就沒有人會信了。
        gives: [ethan-trophy]
        blank:
          - who: 伊森
            text: 我不想講那個。
            mood: 緊
    calm:
      - who: 艾莉絲
        text: 伊森，看著我。現在這個房間裡，只有我站在你那邊。
        mood: 暖
      - who: 伊森
        text: ……好。
    guarded:
      - who: 伊森
        text: 我不想再講了。對不起。
        mood: 緊
      - who: 旁白
        text: 他把椅子往後推，看著地板。會見時間還沒到，但今天問不出更多了。
    outro:
      - who: 艾莉絲
        text: 他講了兩次「妳相信我嗎」。真正說謊的人不會問這個。
        thought: true

  - type: dialogue
    id: take-case
    act: 第一幕
    place: 海爾的辦公室　週一 15:20
    steps:
      - do: say
        who: 艾莉絲
        text: 我要接這個案子。
      - do: say
        who: 薇薇安・惠特洛克
        text: 死者是卡爾德物流的財務長。妳要替殺他的人辯護，還要我們的最大客戶簽豁免書。
        mood: 硬
      - do: say
        who: 馬可仕・海爾
        text: 亞瑟・卡爾德早上簽了。他覺得這案子很單純，簽得很爽快。
      - do: say
        who: 薇薇安・惠特洛克
        text: 公益案件，四十工時。調查二十四，審前十六。超過的部分，妳自己去跟我解釋。
        mood: 硬
      - do: say
        who: 薇薇安・惠特洛克
        text: 還有，羅根當第二律師。
      - do: say
        who: 艾莉絲
        text: 第二律師，還是監視器？
        thought: true
      - do: choose
        prompt: 惠特洛克在等你回話。
        options:
          - text: 謝謝。四十小時夠了。
            then:
              - who: 薇薇安・惠特洛克
                text: 希望如此。
                mood: 硬
          - text: 卡爾德簽得太快了，你們不覺得嗎？
            then:
              - who: 馬可仕・海爾
                text: 覺得。所以我批了這個案子。
                mood: 暖
              - who: 薇薇安・惠特洛克
                text: 馬可仕。
                mood: 硬
      - do: say
        who: 旁白
        text: 16:05，莫羅檢察官的證據開示寄到了。卷宗解鎖。

