  # 辯方證人：布魯克斯法醫（企劃書 6.9.6）
  - type: defense
    id: defense-brooks-ep1
    act: 第四幕
    day: 第三天
    witness:
      name: 艾倫・布魯克斯
      role: 法醫
    intro:
      - who: 旁白
        text: 檢方結束舉證。艾莉絲站起來：「辯方傳喚艾倫・布魯克斯法醫。」
      - who: 羅根
        text: 她是檢方自己的法醫。由她把時間窗縮小，陪審團會比較信。
        mood: 硬
    prep:
      hours: 2
      options:
        - id: prep-none
          label: 不準備
          detail: 直接上庭。她很專業，但第一次被辯方傳喚，會有點緊張。
          multiplier: 0.8
        - id: prep-honest
          label: 正常準備
          detail: 兩個小時過一遍心率資料與死亡時間的推論，只講事實，不改她的措辭。
          multiplier: 1
        - id: prep-coach
          label: 告訴她該怎麼說
          detail: 把每個答案逐字排好。聽起來最有力，但檢方一問就會露餡。
          multiplier: 1
          rehearsed: 1.6
          coached: true
          ethics: [coached-witness]
          flags: [coached-brooks]
    asks: 3
    questions:
      - id: bq-window
        seq: 0
        q: 布魯克斯醫師，您報告裡的死亡時間是週五晚上十點到十一點半。這個推估是怎麼來的？
        a: 體溫和屍僵只能給出一個範圍。範圍很寬，這是方法的限制，不是誰的疏失。
        impact: 8
        tags: [權威, 邏輯]
      - id: bq-watch
        seq: 1
        q: 死者手腕上的智慧手錶，您在驗屍時是怎麼處理的？
        a: 錶帶完好，扣在腕上，背面的感測器貼著皮膚。我拍了照，附在報告裡。
        impact: 10
        tags: [權威, 邏輯]
        rehearsed: true
        needs: [watch-photo]
      - id: bq-hr
        seq: 2
        q: 如果手錶一直貼在死者身上，它記錄的心率歸零，代表什麼？
        a: 代表心臟停止跳動的時間點。比我的體溫推估精確得多。
        impact: 14
        tags: [權威, 邏輯]
        rehearsed: true
        needs: [heart-rate]
      - id: bq-police
        seq: 3
        q: 警方有沒有請您參考手錶的資料？
        a: 沒有。報告交出去之前，沒有人跟我提過那支手錶。
        impact: 7
        tags: [程序]
        door:
          q: 布魯克斯醫師，您和檢察官辦公室合作十五年，從來沒有因為對方的要求修改過報告，對嗎？
          a: ……有過一次。不是這個案子，但確實有過一次。
          penalty: 6
    leak:
      q: 布魯克斯醫師，辯護律師有沒有「教」您該怎麼回答手錶的問題？
      a: 我們……見過面，她跟我討論過怎麼說比較清楚。
      penalty: 8
    outro:
      - who: 旁白
        text: 莫羅檢察官的反詰問結束得比平常早，她沒有再追問手錶。
      - who: 艾莉絲
        text: 十一點半的窗口，現在有一個點釘在裡面了。
        thought: true

  - type: defense
    id: defense-priya
    act: 第四幕
    day: 第三天
    when:
      cards: [heart-rate]
    witness:
      name: 普莉亞・奈爾
      role: 數位鑑識專家
    intro:
      - who: 旁白
        text: 艾莉絲站起來：「辯方傳喚普莉亞・奈爾博士。」
      - who: 馬庫斯・海爾
