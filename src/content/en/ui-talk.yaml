異議: Objection
不異議: No objection

# RelationPicker
第一張卡: The first card
第二張卡: The second card
'{x}和{y}講的是同一件事，互相印證': '{x} and {y} say the same thing and back each other up'
'{x}留下一個範圍或缺口，{y}把它收窄或補上': '{x} leaves a range or a gap, and {y} narrows or fills it'
'{x}和{y}不可能同時成立': '{x} and {y} cannot both be true'
'{x}說明了{y}背後的動機': '{x} explains the motive behind {y}'
'{x}說明了{y}的人有機會做到': '{x} shows the person in {y} had the opportunity'
這兩張卡之間是什麼關係？: How are these two cards related?

# VoiceOver
盧卡斯沒有說出口: What Lucas didn't say aloud
點擊繼續: Click to continue
問法: Approach
擋對的異議: Objections that held
信心再降 {k}，條件就會鬆動。: Drop their confidence {k} more and the terms will move.
這已經是對方開得出來最好的條件。: This is the best they can offer.
被識破了。: They saw through it.
'{name}的信心沒動；之後攤牌的效果少兩成。': "{name}'s confidence didn't move, and your showdowns now land 20% softer."
'{name}的信心 {a} → {b}': "{name}'s confidence {a} → {b}"
條件鬆動了：{label}: 'The terms moved: {label}'
條件沒變。: 'The terms held. '
但仍超過授權，要先打電話請示{name}。: "It's still over your authority, so you have to call {name} first."
但仍超過授權上限。: "It's still over your authority."
'{name}同意了：授權上限 {a} → {b}': '{name} agreed: authority {a} → {b}'
附帶條款也同意了。: 'The extra terms are approved too. '
這個條件現在在授權內，可以建議接受。: These terms are now within your authority. You can advise taking them.
還是不夠，條件仍超過授權。: Still not enough. The terms are over your authority.
