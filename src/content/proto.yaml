expert:
  name: 布魯克斯法醫
  role: 檢方證人，法醫
  questions:
    - id: window
      q: 妳推估的死亡時間是 22:00 到 23:30，這個窗口有一個半小時，對嗎？
      a: 對。僅憑屍體跡象，沒辦法再縮小了。
    - id: watch
      q: 如果死者戴著會持續記錄心率的手錶，那份資料在醫學上能用來縮小死亡時間嗎？
      a: 可以。這類裝置的心率資料通常相當可靠，我們在其他案件也採用過。
      admits: heart
    - id: career
      q: 法醫，您在這一行做了多久？
      a: 二十二年。
      irrelevant: true

witness:
  name: 瑞秋・艾德勒
  role: 檢方證人，卡爾德物流合規長
  irrelevant:
    - q: 艾德勒女士，您在卡爾德物流工作愉快嗎？
      a: ……還算愉快。
  claims:
    - id: thud
      text: 「22:50 左右，我聽到沃斯辦公室傳來爭吵，接著是很重的倒地聲。」
      argument: arg-b
      needs: heart
      lock:
        strong:
          q: 妳確定是十點五十分，不是更早？
          a: 我確定。我那時剛好看了手錶。
        weak:
          q: 大概是那個時間前後吧？
          a: 大概吧，差不多那時候。
      setup:
        q: 沃斯先生每天都會看手錶上的健康資料，這件事妳知道吧？
        a: 知道，他整天都在看那個。他說數字不會騙人。
      confront:
        strong: （瑞秋沉默了幾秒。）「……也許是我記錯了時間。」陪審團有人抬起了頭。
        weak: 「我剛才說了，大概是那個時間。我又不是一直盯著錶。」
    - id: meeting
      text: 「那晚我一直在跟新加坡開視訊會議，開到快十一點。」
      argument: arg-e
      needs: meeting-log
      lock:
        strong:
          q: 會議一直開到快十一點，中間妳沒有離開過？
          a: 沒有，我一直在線上。
        weak:
          q: 會議開了一段時間，對吧？
          a: 對，開了滿久的。
      setup:
        q: 那場會議是陳偉倫主持的季度會議，會議系統會自動記錄每個人的上下線時間，對嗎？
        a: ……對，系統會記錄。
      confront:
        strong: 「那……那是網路斷線。我之後有打電話進去。」她的手在發抖。
        weak: 「我是說我一直在處理會議的事，不一定整晚都掛在線上。」
    - id: left
      text: 「我大約十點四十分就離開 31 樓，之後沒有再上去。」
      argument: arg-d
      needs: chat-audit
      lock:
        strong:
          q: 十點四十分之後，妳一次都沒有回到 31 樓？
          a: 一次都沒有。
        weak:
          q: 妳後來就下樓了，是嗎？
          a: 對，我後來就走了。
      setup:
        q: 公司聊天系統的稽核紀錄，是妳這位合規長負責管理的，對嗎？
        a: ……是我負責的。
      confront:
        strong: （瑞秋看向檢察官，檢察官沒有看她。）
        weak: 「我記不清楚了，可能有回去拿東西吧。」
  breakdown: 瑞秋停頓了很久。「……我拒絕回答，因為答案可能使我自證己罪。」法庭一片寂靜。

closing:
  max: 3
