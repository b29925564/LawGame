          text: 陪審長站起來。「就第一項罪名，我們認定被告無罪。」
        - who: 旁白
          text: 伊森的姊姊在旁聽席上哭出聲。伊森沒有回頭看她，他看著艾莉絲。
        - who: 艾莉絲
          text: 我沒有贏。我只是把那天晚上真正發生的事放進了紀錄裡。
          thought: true
      有罪:
        - who: 旁白
          text: 陪審長站起來。「就第一項罪名，我們認定被告有罪。」
        - who: 伊森・里維拉
          text: （他沒有看她）沒關係。妳已經比上一個律師努力了。
          mood: 緊
        - who: 艾莉絲
          text: 十二年前那句話，我以為我這輩子不會再聽到第二次。
          thought: true
      陪審團僵局:
        - who: 旁白
          text: 陪審長站起來。「庭上，我們無法達成一致的評決。」
        - who: 旁白
          text: 法官宣布審判無效。莫羅檢察官在座位上看著卷宗，很久沒有動。
        - who: 艾莉絲
          text: 有人沒有被說服。下一次開庭之前，我得先知道那個人是誰。
          thought: true

