name: CI

on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    # 25 分鐘太緊：e2e 本身約 14 分鐘，裝 Playwright 字型時 apt 鏡像慢的話會多出近 10 分鐘（11-06 #322、#323 都因此被取消）。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型別檢查
        run: npm run typecheck
      - name: Lint 與格式
        run: npm run lint
      - name: 劇本驗證器
        run: npm run validate:content
      - name: 單元測試
        run: npm test
      - name: 建置
        run: npm run build
      - name: 自動通關測試
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
