          - who: 旁白
            text: 法官宣布審判無效。莫羅檢察官在座位上看著卷宗，很久沒有動。
          - who: 旁白
            text: 三天後，檢察署送來一頁公文：本案不再重新審理。
          - who: 凱瑟琳・莫羅
            text: （電話）手錶、聊天紀錄，換十二個人也一樣。我不拿同一副牌再打一次。
            mood: 硬
          - who: 伊森・蕭
            text: 所以……我不用再回去了？不用了，對吧？
            mood: 緊
          - who: 艾莉絲
            text: 不用了。回家吧，伊森。
          - who: 旁白
            text: 卡爾德大樓三十一樓。瑞秋・艾德勒把電腦裡的資料夾一個一個拖進垃圾桶，然後清空。
    verdicts:
