信心 {n} 以上: Confidence {n}+
信心低於 {n}: Confidence below {n}
現在: Now
超過授權: Over authority
被識破過 {n} 次：攤牌的效果只剩 {p}%。: 'Caught bluffing {n} time{n:s}: your showdowns now land at {p}%.'
