  # 第四幕第一天之前：陪審團遴選（企劃書 6.9.1）
  - type: voirdire
    id: voir-dire
    act: 第四幕
    place: 卡爾德港高等法院　第三法庭
    questions: 6
    peremptories: 3
    seats: 12
    intro:
      - who: 馬可仕・海爾
        text: 十八個人，妳挑十二個。六次提問，三次無因迴避，檢方也有三次。
        mood: 暖
      - who: 馬可仕・海爾
        text: 記住：妳不是在挑喜歡的人，妳是在挑聽得懂妳那套說法的人。
        mood: 暖
      - who: 艾莉絲
        text: 有人明講偏見，我才能請法官剔除。沒憑沒據就聲請，法官會記住。
        thought: true
    candidates:
      - id: c-cop
        name: 華特・費雪
        job: 退休警察
        sheet: 在本市警局服務三十年，去年退休。
        leans: [權威]
        start: 58
        lead: 3
        value: 2
        question:
          q: 您在警局三十年。辦案草率的案子，您看過嗎？
          a: 看過。我最看不起那種人。要辦就辦乾淨。
        hidden: 偏見「信任警察」，但最討厭辦案草率。
      - id: c-dev
        name: 艾拉・鄭
        job: 軟體工程師
        sheet: 三十二歲，單身，寫後端系統。
        leans: [邏輯]
        start: 50
        lead: 2
        value: 9
        question:
          q: 如果一份電子紀錄和一個人的記憶對不上，您信哪一個？
          a: 紀錄。人會記錯時間，機器不會。
        hidden: 取向「邏輯」，對數位證據反應加倍。
      - id: c-mom
        name: 蘿倫・戴維斯
        job: 超市店長
        sheet: 單親，兩個孩子。
        leans: [情感]
        start: 48
        lead: 4
        value: 7
        question:
          q: 有沒有哪個時刻，您覺得一個年輕人只是走錯了路？
          a: 我兒子十七歲的時候被抓過一次。他現在在念大學。
        hidden: 取向「情感」，兒子曾經誤入歧途。
      - id: c-cpa
        name: 保羅・林德
        job: 會計師
        sheet: 在大型會計師事務所任職十二年。
        leans: [邏輯, 權威]
        start: 56
        lead: 6
        value: 4
        question:
          q: 白領犯罪的案子，您怎麼看？
          a: 帳做假就是做假。這種人被起訴，通常不會是冤枉的。
        hidden: 偏見「白領犯罪都是真的」，對動機證據敏感。
      - id: c-student
        name: 尼可・阿巴斯
        job: 大學生
        sheet: 二十一歲，法律系三年級。
        leans: [程序]
        start: 46
        lead: 1
        value: 8
        question:
          q: 警察沒有告知權利就問話，您會在意嗎？
          a: 會。程序不是形式，程序就是保護。
        hidden: 取向「程序」，討厭警方越權。
      - id: c-fired
        name: 唐娜・麥克雷
        job: 待業中
        sheet: 去年被前雇主資遣。
        leans: [情感]
        start: 40
        lead: 1
        value: 6
        question:
          q: 您和卡爾德物流有過什麼樣的關係？
          a: 他們裁了我。那間公司爛透了，講出來的話一個字都不能信。
        hidden: 明確表示對卡爾德物流有偏見。
        cause: true
      - id: c-nurse
        name: 米莉安・奧提茲
        job: 護理師
        sheet: 在急診工作十五年。
        leans: [情感, 權威]
        start: 52
        lead: 5
        value: 5
        question:
          q: 死亡時間這種推估，您在急診看過嗎？
          a: 看過。那是個範圍，不是一個點。醫生自己也會說「大概」。
        hidden: 對法醫證詞有自己的判斷力。
      - id: c-driver
