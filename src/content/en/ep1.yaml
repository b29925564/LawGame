瑪莎・艾弗里: Martha Avery
郵局櫃員: Postal clerk
五十五歲，做了二十五年櫃員。: Fifty-five, twenty-five years behind the counter.
規定和現場狀況衝突的時候，您怎麼做？: When the rules and the situation in front of you conflict, what do you do?
照規定。規定是有理由的。: Follow the rules. There's a reason they exist.
傾向相信制度與官方說法。: Inclined to trust institutions and official accounts.
辯方，開場陳述。: Defense. Opening statement.
每張承諾一張借據: Every promise is an IOU.
第一天: Day One
超市店長、單親媽媽: Supermarket manager, single mother
貨運司機: Delivery driver
高中老師: High school teacher
保險理賠員: Insurance adjuster
圖書館員: Librarian
建築工地領班: Construction foreman
檢方直接詰問的時候，每個問題你都有一次異議的機會。理由錯了，法官的耐心就少一格。: On direct, you get one shot at an objection per question. Pick the wrong ground and the judge's patience drops a notch.
五次。用完之前，讓陪審團看到這個警探什麼都沒查。: Five. Before you run out, let the jury see this detective checked nothing.
柯瓦斯基: Kowalski
重案組警探・服務 22 年: Detective, Major Crimes, 22 years on the force
警探，請說明您到達現場時看到的情況。: Detective, please describe what you saw when you arrived at the scene.
死者倒在辦公桌旁，頭部有重擊傷。桌上的水晶獎盃掉在地毯上，上面有血。: The victim was on the floor beside his desk with a blunt-force wound to the head. A crystal award from the desk was on the carpet. It had blood on it.
門禁紀錄顯示被告 22:47 上樓。這代表他在案發時間在場，對不對？: The access log shows the defendant went upstairs at 10:47 p.m. That means he was present at the time of the killing, correct?
對，這正是我們鎖定他的原因。: Correct. That's exactly why we focused on him.
誘導: Leading
異議成立。檢察官，請不要把答案放進問題裡。: Sustained. Counsel, don't put the answer in the question.
大樓警衛跟您說，他看到被告驚慌地跑出大廳，是嗎？: The building guard told you he saw the defendant run out of the lobby in a panic, didn't he?
警衛是這樣告訴我的。: That's what the guard told me.
傳聞: Hearsay
異議成立。警衛本人可以自己來作證。: Sustained. The guard can come and testify himself.
以您二十二年的辦案經驗，被告當時的心裡在想什麼？: Based on your twenty-two years of experience, what was going through the defendant's mind?
一個剛犯下重罪的人會想的事：離開現場。: "What anyone who's just committed a serious crime thinks about: getting away from the scene."
異議成立。證人不是被告肚子裡的蛔蟲。: Sustained. The witness is not inside the defendant's head.
被告四年前也曾經被逮捕，您知道嗎？: Were you aware the defendant was also arrested four years ago?
我調過他的紀錄，持有毒品。: I pulled his record. Drug possession.
無關: Relevance
品格證據: Improper character evidence
異議成立。前科是品格證據，不能用來證明被告這一次做了什麼。陪審團請忽略這個問題。: Sustained. A prior record is character evidence. It cannot be used to prove what the defendant did this time. The jury will disregard the question.
警探，逮捕當天，被告在警車上說了什麼？: Detective, on the day of the arrest, what did the defendant say in the patrol car?
他自己開口說：「我只是想讓他住手。」沒有人問他任何問題。: 'He said it on his own: "I just wanted him to stop." Nobody had asked him anything.'
我們檢查了所有跟被告有關的證據。: We examined all the evidence connected to the defendant.
警探，「所有」是指所有。您是不是要告訴陪審團，這個案子裡沒有一樣東西您沒查？: Detective, "all" means all. Are you telling this jury there is not one thing in this case you didn't check?
我是說，該查的我們都查了。凶器、門禁、指紋、血跡，全部。: I'm saying we checked everything that needed checking. The weapon, the access log, prints, blood. All of it.
你們大概都查過了吧？: You checked pretty much everything, I suppose?
我們查了該查的東西。案發現場能採的都採了。: We checked what needed checking. We collected everything the scene had to give.
在那之前先請教一個常識問題：智慧手錶會同步手機的通知，這一點您同意嗎？: Before that, a question of common knowledge. A smartwatch mirrors the phone's notifications. You'd agree with that?
……會。這是常識。: "...It does. That's common knowledge."
（很長的停頓）那則通知……我沒有看過。被告的手機裡沒有那則訊息，所以我們沒有再往下查。: (A long pause) That notification... I never looked at it. The message wasn't on the defendant's phone, so we didn't go any further.
我說的是該查的都查了。手錶那種東西，我們通常不會特別去調。: I said we checked what needed checking. A watch isn't something we'd normally pull.
警探，那則通知預覽有沒有可能是被告自己用別的帳號傳給自己的？: Detective, could that notification preview have been sent by the defendant to himself from another account?
庭上，稽核紀錄顯示發送裝置是死者辦公室的桌機，不是被告的手機。: Your Honor, the audit log shows the sending device was the desktop in the victim's office. Not the defendant's phone.
庭上……我手上沒有能證明是誰傳的東西。: Your Honor... I have nothing that proves who sent it.
警探，您辦過多少件命案？: Detective, how many homicides have you worked?
加上這件，一百一十七件。: Counting this one, a hundred and seventeen.
您是什麼時候決定被告就是兇手的？: When did you decide the defendant was the killer?
我沒有「決定」，我是依證據辦案。: I didn't "decide" anything. I follow the evidence.
（陪審席上，那位軟體工程師放下了筆，看著證人席。）: (In the jury box, the software engineer puts down her pen and looks at the witness stand.)
法官宣布休庭。走廊上，莫羅檢察官從後面追上來。: The judge calls a recess. In the hallway, Prosecutor Morrow catches up from behind.
葛雷律師。過失致死，緩刑五年。這是我最後的條件。: Mr. Grey. Negligent homicide, five years' probation. That's my final offer.
第四幕　庭審　第二天: 'Act Four: Trial, Day Two'
檢方先傳喚死者的執行助理蘇菲・馬丁內斯，用她建立動機。: The prosecution calls the victim's executive assistant, Sophie Martinez, to establish motive.
最後一位證人是瑞秋・艾德勒：她是唯一聽見聲音的人，也是全案最無懈可擊的證人。: 'Their last witness is Rachel Adler: the only person who heard anything, and the most untouchable witness in the case.'
第二天: Day Two
她只聽到半句。整個法庭，只有你會替被告講這一點。: She heard half a sentence. In this whole courtroom, you're the only one who'll say that for the defendant.
死者的執行助理・三十歲: The victim's executive assistant, thirty
馬丁內斯小姐，您替沃斯先生工作多久了？: Ms. Martinez, how long did you work for Mr. Voss?
四年。我負責他的行事曆、信件，還有他想不到要自己處理的事。: Four years. I handled his calendar, his mail, and everything he never thought to handle himself.
被告那天下午威脅了沃斯先生，是不是？: The defendant threatened Mr. Voss that afternoon, didn't he?
他是這麼大喊的。: That's what he shouted.
您在門外聽見被告說了什麼？: What did you hear the defendant say from outside the door?
他大喊：「你會後悔的！」然後摔門出來。: He shouted, "You'll regret this!" Then he slammed the door on his way out.
沃斯先生跟您說過，伊森那天下午動了公司的錢，是嗎？: Mr. Voss told you that Ethan had been moving company money, didn't he?
他說伊森動了帳上的錢，他已經抓到了。: He said Ethan had touched the books, and that he'd caught him.
異議成立。死者的話，本庭不能經由證人轉述。: Sustained. The victim's words cannot come in through this witness.
以您對被告的了解，他那天下午是不是已經打算動手？: Knowing the defendant as you do, had he already decided to act that afternoon?
他那種語氣，我想他是氣到失去理智了。: The way he sounded, I think he was too angry to think straight.
異議成立。證人不能替被告揣測他當時的意圖。: Sustained. The witness cannot guess at the defendant's intent.
案發當晚您在哪裡？: Where were you on the night of the killing?
我 19:02 刷卡離開大樓，直接回家了。: I badged out of the building at 7:02 p.m. and went straight home.
我 19:02 離開大樓，之後直接回家。: I left the building at 7:02 p.m. and went straight home.
馬丁內斯小姐，19:02 離開之後，您沒有繞去任何地方，也沒有再回到大樓附近，對嗎？: Ms. Martinez, after you left at 7:02, you didn't stop anywhere and you didn't come back near the building. Is that right?
沒有。我直接回家，一路上沒有停。: That's right. I went straight home. I didn't stop.
您那晚大概是下班就回家了吧？: That night you more or less went home after work, I take it?
差不多。我不記得每個細節。: More or less. I don't remember every detail.
請教一個小事：卡爾德大樓的員工下班，是從大廳走，還是開車從地下停車場走？: One small thing. When Calder employees leave for the day, do they go out through the lobby, or drive out of the underground garage?
我開車，停在地下停車場。: I drive. I park in the underground garage.
（很長的沉默）……我在車上待了一陣子。那件事和命案沒有關係。: (A long silence) ...I sat in my car for a while. It had nothing to do with the murder.
我說的是大概。我真的記不清那天晚上幾點開走的。: I said more or less. I honestly don't remember what time I drove off that night.
您平常幾點下班？: What time do you usually finish work?
沃斯先生在的時候，沒有固定的時間。: When Mr. Voss was alive, there was no usual time.
您喜歡這份工作嗎？: Did you like the job?
他是個很難伺候的老闆，但我學到很多。: He was a hard man to work for. But I learned a lot.
（陪審席上，那位超市店長皺起了眉，在筆記本上寫了一行字。）: (In the jury box, the supermarket manager frowns and writes a line in her notebook.)
蘇菲離開證人席的時候，沒有看被告那一邊。: Sophie leaves the stand without looking toward the defense table.
她會很穩。穩的證人只有一種拆法：讓她把話說死，再拿時間去對。: "She'll be steady. There's only one way to take apart a steady witness: let her lock it in, then check it against the clock."
已定錨: Locked in.
艾德勒女士，您在卡爾德物流擔任什麼職務？: Ms. Adler, what is your position at Calder Logistics?
合規長。我在公司九年了。: Chief Compliance Officer. I've been with the company nine years.
案發當晚，您在三十一樓，是嗎？: On the night of the killing, you were on the thirty-first floor, correct?
是。我在自己的辦公室裡開線上會議。: Yes. I was in my office, in an online meeting.
您聽見了什麼？: What did you hear?
十點五十分左右，隔壁房間有很重的一聲，像是有人倒下去。: Around ten fifty, a heavy sound from the next room. Like someone falling.
以一位在公司九年的主管來看，被告是個什麼樣的人？: As an executive with nine years at the company, what kind of person is the defendant?
情緒化。他跟沃斯吵過不只一次。: Volatile. He argued with Voss more than once.
異議成立。證人對被告的評價是品格證據，不能拿來證明他那天晚上做了什麼。: Sustained. The witness's opinion of the defendant is character evidence. It cannot be used to prove what he did that night.
您的同事跟您說過，被告那天下午在走廊上大吼，是嗎？: Your colleagues told you the defendant was shouting in the hallway that afternoon, didn't they?
有人跟我說過。: Someone told me that.
異議成立。聽別人說的不算證據。: Sustained. What someone else said is not evidence.
您整晚都在會議裡，沒有離開座位，對不對？: You were in the meeting all evening and never left your desk, correct?
對。從九點到十一點半。: Correct. From nine until eleven thirty.
異議成立。檢察官，請不要替證人作證。: Sustained. Counsel, don't testify for the witness.
您和死者的關係如何？: What was your relationship with the deceased?
我們共事九年。他找我進公司的。: We worked together for nine years. He brought me into the company.
我在十點五十分聽見隔壁有人倒地。: I heard someone fall next door at ten fifty.
艾德勒女士，十點五十分。您確定是這個時間，不是十點半，也不是十一點？: Ms. Adler, ten fifty. You're certain of that time? Not ten thirty, not eleven?
我確定。我看了螢幕右下角的時間。: I'm certain. I looked at the clock in the corner of my screen.
那大概是十點五十分左右吧？: That was roughly ten fifty or so?
差不多。我沒有特別去看時鐘。: Roughly. I didn't make a point of checking the clock.
在那之前請教一件事：死者手上的智慧手錶會記錄心率，這一點您應該不陌生？: Before that, one thing. The smartwatch on the victim's wrist records heart rate. That wouldn't be news to you?
公司有發健康手錶。我自己也有一支。: The company issued health watches. I have one myself.
（停頓）……那我可能記錯了。但我確實聽見了聲音。: (A pause) ...Then I may have the time wrong. But I did hear it.
我說的是大概。人不會每分每秒都在看時鐘。: I said roughly. Nobody watches the clock every minute.
艾德勒女士，手錶在搏鬥中有沒有可能脫落？心率歸零，就一定是死亡的時間嗎？: Ms. Adler, could the watch have come off in a struggle? Does a heart rate dropping to zero have to mean the time of death?
庭上，驗屍照片顯示手錶仍扣在死者腕上，錶帶完好。它沒有脫落。: Your Honor, the autopsy photographs show the watch still fastened on the victim's wrist, strap intact. It did not come off.
庭上……我手上沒有能證明手錶沒有脫落的東西。: Your Honor... I have nothing that proves the watch stayed on.
我從九點到十一點半，全程在線上會議裡。: I was in the online meeting the entire time, from nine until eleven thirty.
全程。也就是說，從九點到十一點半，您一分鐘都沒有離開過那場會議？: The entire time. So from nine until eleven thirty, you did not leave that meeting for a single minute?
一分鐘都沒有。: Not a single minute.
您那天晚上大致上都在開會吧？: You were mostly in the meeting that evening, I take it?
對，大致上都在。: Yes. Mostly.
那場會議叫「北門結案會議」，出席紀錄由系統自動產生，您同意嗎？: That meeting was the "Northgate closeout meeting," and the attendance log is generated automatically by the system. Would you agree?
……應該是。: '...I believe so.'
（很長的停頓）二十二點零八分我離線了一下。我去倒水。: (A long pause) I dropped off at 10:08 for a moment. I went to get some water.
我可能中間離開過一兩分鐘。誰不會呢。: I may have stepped away for a minute or two. Who doesn't.
二十三點十四分，我不知道三十一樓還有誰。: At 11:14 p.m., I don't know who else was on the thirty-first floor.
二十三點十四分。那個時間，三十一樓除了您，還有誰在？: Eleven fourteen p.m. At that time, who was on the thirty-first floor besides you?
那麼晚了，樓上應該沒什麼人了吧？: That late, there couldn't have been many people left upstairs?
大概吧。我沒有出去看。: Probably not. I didn't go out to look.
門禁紀錄顯示，二十三點零一分之後，三十一樓沒有人再刷卡進出。這份紀錄您有理由懷疑嗎？: The access log shows that after 11:01 p.m., nobody badged in or out of the thirty-first floor. Do you have any reason to doubt that record?
沒有。門禁是公司自己的系統。: No. The access system is the company's own.
（她看向檢方席。沒有人看她。）我……我要跟我的律師談一下。: (She looks at the prosecution table. Nobody looks back.) I... I need to speak with my lawyer.
那不代表什麼。有人可以跟著別人進來，不刷卡。: That doesn't mean anything. Someone could have followed another person in without badging.
艾德勒女士，您稍早補充過，二十三點十分您去敲過沃斯的門，沒有人應門就離開了，對嗎？: Ms. Adler, you added earlier that at 11:10 p.m. you knocked on Voss's door and left when nobody answered, is that right?
庭上，二十三點十四分有人在那個房間的桌機上操作。她若在門口，就一定進過房間。: Your Honor, at 11:14 someone was using the desktop in that room. If she was at the door, she went inside.
庭上……如果她只是敲了門，那的確不能證明什麼。: Your Honor... if she only knocked, then no, it doesn't prove anything.
艾德勒女士，您那天晚上加班到幾點？: Ms. Adler, how late did you work that night?
我說過了，十一點半。: I've said. Eleven thirty.
您和死者私下有往來嗎？: Did you and the deceased see each other outside work?
我們是同事。: We were colleagues.
（陪審席上，那位國中老師轉頭看了證人席很久。）: (In the jury box, the middle school teacher turns and watches the witness stand for a long time.)
（很長的停頓）我拒絕回答，因為答案可能使我自證己罪。: (A long pause) I decline to answer on the grounds that it may incriminate me.
法庭裡沒有人說話。莫羅檢察官站起來，請求休庭。: Nobody in the courtroom speaks. Prosecutor Morrow stands and asks for a recess.
法官沒有馬上回應休庭的請求。他轉向陪審席。: The judge doesn't answer the request right away. He turns to the jury box.
陪審團請注意：本席裁定，證人艾德勒女士的證詞全部刪除。各位評議時不得列入考慮。: 'Members of the jury: the testimony of Ms. Adler is stricken in its entirety. You will not consider it in your deliberations.'
陪審席上，有兩個人還看著空下來的證人席。: In the jury box, two people are still looking at the empty witness stand.
法官宣布休庭到明天上午。旁聽席的人還沒有散。: The judge adjourns until tomorrow morning. The gallery hasn't moved.
我做了三十年，看過三次這種場面。: Thirty years in this business. I've seen that three times.
第四幕　庭審　第三天: 'Act Four: Trial, Day Three'
第三天: Day Three
法醫: Medical examiner
檢方結束舉證。盧卡斯站起來：「辯方傳喚艾倫・布魯克斯法醫。」: 'The prosecution rests. Lucas stands: "The defense calls Dr. Ellen Brooks."'
她是檢方自己的法醫。由她把時間窗縮小，陪審團會比較信。: She's the prosecution's own medical examiner. If she narrows the window, the jury will believe it.
不準備: No prep
直接上庭。她很專業，但第一次被辯方傳喚，會有點緊張。: Put her straight on the stand. She's a professional, but it's her first time called by the defense. She'll be a little nervous.
正常準備: Normal prep
兩個小時過一遍心率資料與死亡時間的推論，只講事實，不改她的措辭。: Two hours walking through the heart-rate data and the time-of-death reasoning. Facts only. Her wording stays hers.
告訴她該怎麼說: Script her answers
把每個答案逐字排好。聽起來最有力，但檢方一問就會露餡。: Lay out every answer word for word. Sounds the strongest. Falls apart the moment the prosecution asks.
布魯克斯醫師，您報告裡的死亡時間是週五晚上十點到十一點半。這個推估是怎麼來的？: Dr. Brooks, your report puts the time of death between ten and eleven thirty on Friday night. How did you arrive at that estimate?
體溫和屍僵只能給出一個範圍。範圍很寬，這是方法的限制，不是誰的疏失。: Body temperature and rigor only give you a range. It's a wide range. That's a limit of the method, not anyone's mistake.
死者手腕上的智慧手錶，您在驗屍時是怎麼處理的？: The smartwatch on the victim's wrist. How did you handle it during the autopsy?
錶帶完好，扣在腕上，背面的感測器貼著皮膚。我拍了照，附在報告裡。: The strap was intact and fastened, with the sensor on the back against the skin. I photographed it. It's in the report.
如果手錶一直貼在死者身上，它記錄的心率歸零，代表什麼？: If the watch stayed on the victim's body, what does it mean when the heart rate it recorded drops to zero?
代表心臟停止跳動的時間點。比我的體溫推估精確得多。: It marks the moment the heart stopped. Far more precise than my temperature estimate.
警方有沒有請您參考手錶的資料？: Did the police ask you to consider the watch data?
沒有。報告交出去之前，沒有人跟我提過那支手錶。: No. Nobody mentioned the watch to me before I filed the report.
布魯克斯醫師，您和地方檢察官辦公室合作十五年，從來沒有因為對方的要求修改過報告，對嗎？: Dr. Brooks, in fifteen years of working with the District Attorney's office, you have never changed a report at their request. Correct?
……有過一次。不是這個案子，但確實有過一次。: '...Once. Not on this case. But yes, once.'
