name: CI

on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

# 預設只給讀取；要寫的工作（flaky、report 開 Issue）在自己的 job 裡另外開 issues: write（#380 S4）。
permissions:
  contents: read

# PR 推新的就取消舊的。main 不取消正在跑的全站掃描（約 30 分鐘）：合併一密，每一輪都被下一次合併取消，
# 11-16 main 連續 20 輪全被取消、一輪都沒跑完。改成跑完再跑最新的那一輪（中間排隊的會被更新的取代）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型別檢查
        run: npm run typecheck
      - name: Lint 與格式
        run: npm run lint
      - name: 劇本驗證器
        run: npm run validate:content
      - name: 單元測試
        run: npm test
      - name: 建置
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  # 11-13：e2e 單機跑到 41 分鐘（4 核、2 個 worker）。拆成 4 台同時跑，測試一個都不少。
  e2e:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 自動通關測試（第 ${{ matrix.shard }}／4 份）
        env:
          PW_PREBUILT: '1'
          # PR 只跑快速層（第一級組合）；合併到 main 後跑全站掃描（process-v2 第 5 節）。
          E2E_TIER: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --shard=${{ matrix.shard }}/4
      - name: 記下重跑才過的測試（不穩定）
        if: always()
        run: node scripts/ci/flaky.mjs pw-json/report.json "e2e ${{ matrix.shard }}" > flaky.jsonl
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-e2e-${{ matrix.shard }}
          path: flaky.jsonl
          if-no-files-found: ignore
          retention-days: 3
      - name: 挑出第二、三級的結果（只開 C 級 Issue，不擋）
        if: always() && github.event_name != 'pull_request'
        run: node scripts/ci/tier23.mjs pw-json/report.json > tier23.jsonl
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier23-e2e-${{ matrix.shard }}
          path: tier23.jsonl
          if-no-files-found: ignore
          retention-days: 3

  # WebKit 冒煙（第一級支援：中文 100%、桌機 1366、手機 390）：Safari 只有 WebKit，Chromium 測不到。
  # 只跑第 1 集整集通關＋第 2 集每種場景各一次，和 e2e 分片同時跑，不拉長 CI。
  webkit:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: WebKit 冒煙
        env:
          PW_PREBUILT: '1'
        run: |
          npx playwright install --with-deps webkit
          npx playwright test -c playwright.webkit.config.ts
      - name: 記下重跑才過的測試（不穩定）
        if: always()
        run: node scripts/ci/flaky.mjs pw-json/report.json "webkit" > flaky.jsonl
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-webkit
          path: flaky.jsonl
          if-no-files-found: ignore
          retention-days: 3
      - name: 失敗時印出畫面快照與截圖（artifact 下載不到時用）
        if: failure()
        run: |
          for f in test-results/*/error-context.md; do echo "=== $f"; cat "$f"; done
          for f in test-results/*/test-failed-1.png; do echo "=== PNG $f"; base64 -w0 "$f"; echo; done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-results
          path: test-results
          retention-days: 7

  # 全路線通關（第 1 集 R1–R7、第 2 集 E1–E11，兩種寬度）：每條約 3–4 分鐘，只在合併後跑。
  routes:
    needs: static
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 全路線通關＋設定集稽核（第 ${{ matrix.shard }}／4 份）
        env:
          PW_PREBUILT: '1'
          # 每個截圖點跑設定集稽核（一格一黃、動態、百分比、紅章、虛線框、黑條），違規就紅。
          BIBLE: '1'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.sweep.config.ts --shard=${{ matrix.shard }}/4
      - name: 記下重跑才過的測試（不穩定）
        if: always()
        run: node scripts/ci/flaky.mjs pw-json/report.json "routes ${{ matrix.shard }}" > flaky.jsonl
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-routes-${{ matrix.shard }}
          path: flaky.jsonl
          if-no-files-found: ignore
          retention-days: 3

  # 黑底鏡頭層的選單鈕顏色（process-v2 第 5 節第 14 項）：25 個鏡頭層情境逐幀量像素，體驗評測的腳本原樣搬來。
  camera:
    needs: static
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        size: [p7, '1530', '320']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: |
          npx playwright install --with-deps chromium
          # python3 -I 會略過使用者 site-packages，所以裝進 venv 並放到 PATH 最前面
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet numpy pillow
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: 選單鈕顏色（${{ matrix.size }}）
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 30); do curl -sf http://localhost:4173 >/dev/null && break; sleep 1; done
          qa/gate2/ci-camera.sh "$RUNNER_TEMP/camera" ${{ matrix.size }}

  # 重跑才過的測試（playwright.config.ts 的 retries）：不擋合併，但每一條都開成 C 級 Issue；
  # 同一條已經有開著的 Issue 就留言記這一次，不重複開。
  flaky:
    needs: [e2e, webkit, routes]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flaky-*
          path: flaky
      - name: 開 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          WHERE=${PR:+PR #$PR}; WHERE=${WHERE:-$BRANCH}
          cat flaky/*/flaky.jsonl 2>/dev/null > all.jsonl || true
          [ -s all.jsonl ] || { echo '沒有不穩定的測試'; exit 0; }
          jq -r '.key' all.jsonl | sort -u | while IFS= read -r key; do
            title="不穩定測試：${key:0:200}"
            body=$(jq -r --arg k "$key" 'select(.key == $k) | "- \(.job)（\(.project)）\(.file):\(.line)\n```\n\(.error)\n```"' all.jsonl)
            n=$(gh issue list --state open --label C --search "in:title 不穩定測試" --limit 200 --json number,title \
              | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -1)
            note=$(printf '%s 第一次失敗、重跑才過：%s\n\n%s' "$WHERE" "$RUN" "$body")
            if [ -n "$n" ]; then
              gh issue comment "$n" --body "$note"
            else
              gh issue create --label C --title "$title" --body "$(printf '%s\n\n這條測試第一次失敗、自動重跑才過，CI 沒有擋下來。請把測試裡寫死的等待改成等畫面狀態，或找出真正的原因；不要刪測試或跳過。\n\n_由 CI 的 flaky 工作自動開立_' "$note")"
            fi
          done

  # 第二、三級組合（英文、125／150%、360、320）和第一級其他尺寸的名稱毛病：照跑不擋，開成 C 級 Issue
  # （process-v2 第 5 節第 8 項）。每個「檔案 › 組合」一張；已經開著的就改內文換成最新結果，不留言、不通知。
  tier23:
    needs: e2e
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tier23-*
          path: tier23
      - name: 開或更新 C 級 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat tier23/*/tier23.jsonl 2>/dev/null > all.jsonl || true
          [ -s all.jsonl ] || { echo '第二、三級沒有結果'; exit 0; }
          open=$(gh issue list --state open --label C --search "in:title 第二三級" --limit 200 --json number,title)
          jq -c '.' all.jsonl | while IFS= read -r g; do
            key=$(jq -r '.key' <<<"$g")
            title="第二三級：${key:0:200}"
            list=$(jq -r '.items[] | "- \(.)"' <<<"$g" | head -c 55000)
            body=$(printf '%s 的全站掃描（%s）：\n\n%s\n\n第二、三級組合照跑不擋，結果只開 C 級 Issue（process-v2 第 5 節第 8 項）。每次 main 的全站掃描會把內文換成最新結果；修好、或裁定不算以後，請關掉這張。\n\n_由 CI 的 tier23 工作自動開立_' "${GITHUB_SHA::7}" "$RUN" "$list")
            n=$(jq -r --arg t "$title" '.[] | select(.title == $t) | .number' <<<"$open" | head -1)
            if [ -n "$n" ]; then gh issue edit "$n" --body "$body"
            else gh issue create --label C --title "$title" --body "$body"; fi
          done

  # 合併保護看的是這個名字：上面全部綠才綠。
  check:
    needs: [static, e2e, webkit, routes, camera]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 全部通過
        run: |
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ] && [ "${{ needs.webkit.result }}" = success ] && [[ "${{ needs.routes.result }}" =~ ^(success|skipped)$ ]] && [[ "${{ needs.camera.result }}" =~ ^(success|skipped)$ ]]

  # 合併後全站掃描紅了：開 Issue（C 級以外由協調者分級），不必等人去看 Actions。
  report:
    needs: [static, e2e, webkit, routes, camera]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create -R "${{ github.repository }}" \
            --title "main 全站掃描失敗：${GITHUB_SHA::7}" \
            --body "合併後的全站掃描在 ${GITHUB_SHA} 失敗：$RUN"
