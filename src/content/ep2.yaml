  # 原告第一位證人：瑪莉索。對她做交互詰問，是本集最難受的一場。
  - type: trial
    id: court-marisol
    act: 第五幕
    day: 第一天
    threshold: 50
    burden: civil
    quorum: 4
    patience: 5
    jurors:
      - id: j1
        label: 退休公車司機
        leans: [情感]
        start: 57
      - id: j2
        label: 保險精算師
        leans: [邏輯]
        start: 51
        foreperson: true
      - id: j3
        label: 小型物流行老闆
        leans: [權威]
        start: 47
      - id: j4
        label: 急診護理師
        leans: [情感, 邏輯]
        start: 59
      - id: j5
        label: 法律系學生
        leans: [程序]
        start: 55
      - id: j6
        label: 超市夜班主管
        leans: [權威, 情感]
        start: 53
    intro:
      - who: 羅根・普萊斯
        text: 原告的直接詰問。她說的每一句都會讓陪審團心軟，你只能在問題本身有毛病的時候異議。
        mood: 硬
    witness:
      name: 瑪莉索・維加
      role: 原告・死者遺孀
      direct:
        - id: m1
          q: 維加太太，請告訴陪審團，赫克托是什麼樣的人。
          a: 他很安靜。每天早上七點出門，晚上回來會先去看女兒的房間，再吃飯。
          impact: 4
          tags: [情感]
        - id: m2
          q: 他最後那兩個禮拜，為什麼每天跑那麼久？
          a: 女兒的註冊費。他說跑完這兩個禮拜就好。
          impact: 5
          tags: [情感]
        - id: m3
          q: 赫克托有沒有跟妳說過，公司的人告訴他不准休息？
          a: 他說主管講過，旺季誰下線誰就等著被降級。
          objection: 傳聞
          sustained: 異議成立。證人只能說她自己知道的事。
          impact: 6
          tags: [情感, 權威]
        - id: m4
          q: 妳覺得卡爾德物流在乎他的命嗎？
          a: 他死了以後，他們的 App 還在叫他接單。
          objection: 推測
          sustained: 異議成立。陪審團請忽略。
          impact: 7
          tags: [情感]
        - id: m5
          q: 那天傍晚五點五十二分，妳收到了什麼？
          a: 一則語音。他說再跑兩單就回家，叫我先吃，不用等他。
          impact: 6
          tags: [情感]
        - id: m6
          q: 公司的 App 在他死後還扣了他的分，這難道不是冷血嗎？
          a: 是。他們連他死了都不放過。
          objection: 誘導
          sustained: 異議成立。律師，請讓證人自己回答。
          impact: 6
          tags: [情感]
      claims:
        - id: c-healthy
          text: 他身體一直很好，從來沒有生過病。
          argument: arg-a
          needs: pharmacy
          lock:
            strong:
              q: 維加太太，您剛才說他身體一直很好。「一直」，是指包括最後那三個月嗎？
              a: ……對。他從來不喊累，也沒有生過病。
            weak:
              q: 他身體應該還不錯吧？
              a: 他不常看醫生。
          setup:
            q: 您先生的語音裡說「回家吃藥」。他吃的是什麼藥？
            a: 我……我不知道。他沒有跟我說過。
          confront:
            strong: （她看著藥局紀錄看了很久）……三個月的藥，他只拿了一次。他說等這個月的錢下來。
            weak: 他有在看醫生。我不知道他有沒有去拿藥。
        - id: c-forced
          text: 公司逼他一直跑，他沒有辦法停下來。
          argument: arg-d
          needs: contract
          lock:
            strong:
              q: 維加太太，您說公司「逼」他。是有人規定他每天要跑幾個小時嗎？
              a: 沒有人規定。可是大家都知道，不跑就排不到單。
            weak:
              q: 他工作壓力很大吧？
              a: 很大。
          setup:
            q: 他什麼時候出門、什麼時候收工，是誰決定的？
            a: ……他自己。他說這是這份工作唯一的好處。
          confront:
            strong: （她看著合約那一行）……上面是這樣寫。可是不跑，就沒有錢。
            weak: 合約怎麼寫是一回事。
        - id: c-home
          text: 他那天是要回家的，是 App 不讓他走。
          argument: arg-h
          needs: voice-memo
          lock:
            strong:
              q: 您說那天是 App 不讓他走。他有跟您說過他想收工嗎？
              a: 有。他傳了語音給我，說要回家。
            weak:
              q: 他那天很想回家吧？
              a: 他每天都想回家。
          setup:
            q: 那則語音，您後來聽了幾次？
            a: （停了很久）每天。
          confront:
            strong: （語音播出來，她閉上眼睛）……「再跑兩單」。是他自己說的。
            weak: 他說了要回家。他只是沒有回來。
      irrelevant:
        - q: 您和赫克托結婚多久了？
          a: 二十二年。
      breakdown: （瑪莉索低下頭。旁聽席有人倒抽一口氣。陪審席上，那位精算師在筆記本上寫了一行字。）
    outro:
      - who: 旁白
        text: 法官宣布休庭十分鐘。瑪莉索走下證人席，經過被告席時停了一下，沒有說話。
      - who: 盧卡斯
        text: 我贏了這一題。｜我寧可輸。
        voice: 'off'

