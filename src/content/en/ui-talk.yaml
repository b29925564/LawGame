選擇: Choose

# Interview
提問: Ask
施壓: Press
'安撫（剩 {n} 次）': 'Reassure ({n} left)'
沒有別的想問了。: Nothing else to ask.
施壓會讓他更防備。手上有東西撐著再問。: Pressing makes him more guarded. Ask when you have something to back it up.
離開會見室: Leave the meeting room
結束會見: End meeting
還有關鍵的事沒問: Key questions remain

