      - id: o-manslaughter
        min: 60
        label: 故意殺人，八年
        lines:
          - who: 凱瑟琳・莫羅
            text: 故意殺人，八年。妳的那些東西還不足以讓陪審團轉向。
            mood: 硬
        asks:
          - who: 伊森・蕭
            text: 八年還是八年。妳覺得我該接受嗎？
            mood: 緊
      - id: o-negligent
        min: 40
        label: 過失致死，三年
        lines:
          - who: 凱瑟琳・莫羅
