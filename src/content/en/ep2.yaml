你們會聽到，他那天傍晚說過要回家吃藥。最後兩單，是他自己選的。: You will hear that he said that evening he was going home for his pills. The last two runs were his own choice.
卡爾德郡高等法院　第五法庭: Calder County Superior Court, Courtroom 5
民事庭，六個人。十個候選人，四次提問，兩次無因迴避，對方也有兩次。: Civil jury, six seats. Ten candidates, four questions, two peremptory strikes. The other side gets two as well.
這次你要找的，是會替公司算帳的人。你自己知道那有多難受。: This time you're looking for people who'll do the math for a company. You know how that feels.
雷蒙・葛林: Raymond Green
退休公車司機: Retired bus driver
開了三十年公車，排班表比家裡的月曆還熟。: Thirty years driving buses. Knows a shift schedule better than the calendar at home.
您開車的那些年，有沒有過累到不該開、卻還是開了的時候？: In your years of driving, was there ever a time you were too tired to drive, and drove anyway?
每個禮拜都有。公司不會叫你停，你自己也不敢停。: Every week. The company won't tell you to stop, and you don't dare stop on your own.
對過勞的司機有切身的同情。: Feels for overworked drivers from his own experience.
茱蒂絲・柯恩: Judith Cohen
保險精算師: Insurance actuary
四十五歲，工作是把風險算成數字。: Forty-five. Her job is turning risk into numbers.
一個人知道自己有病卻不吃藥，這個風險該算在誰頭上？: A man knows he's sick and doesn't take his medication. Whose account does that risk go on?
先算在他自己頭上。然後再看有沒有別人把風險加大。: His own, first. Then you look at whether anyone else made the risk bigger.
取向「邏輯」，比較過失的論點對她特別有效。: Leans logic. Comparative-fault arguments work especially well on her.
馬可・費拉拉: Marco Ferrara
小型物流行老闆: Small freight company owner
自己開了一家八台車的貨運行。: Runs his own eight-truck freight outfit.
您的司機如果累了，您會怎麼做？: If one of your drivers is tired, what do you do?
叫他回家睡覺。但我的司機是我的員工，不是什麼承攬人。: Send him home to sleep. But my drivers are my employees, not "contractors."
同情雇主，但看不起把司機叫成承攬人的大公司。: Sympathetic to employers, but despises big companies that call drivers contractors.
安娜・洛佩茲: Ana Lopez
急診護理師: ER nurse
夜班十年，看過很多心肌梗塞。: Ten years of night shifts. Has seen a lot of heart attacks.
心肌梗塞的病人，多半事前知道自己有問題嗎？: Heart attack patients. Do most of them know beforehand that something is wrong?
很多人知道。知道和有時間去處理，是兩回事。: Many do. Knowing and having the time to deal with it are two different things.
凱文・吳: Kevin Wu
法律系學生: Law student
二十三歲，正在修侵權行為法。: Twenty-three, currently taking torts.
公司把文件交出來了，或沒交出來，您會怎麼想？: When a company produces a document, or doesn't, what do you make of it?
交出來的我會看。沒交出來的，我會想為什麼。: What they produce, I read. What they don't, I wonder why.
朵琳・貝克: Doreen Baker
超市夜班主管: Supermarket night-shift supervisor
管二十個夜班員工，自己也上夜班。: Supervises twenty night-shift staff and works nights herself.
規定說可以休息，但休息會被扣分。這算可以休息嗎？: The rules say you can rest, but resting costs you points. Does that count as being allowed to rest?
那叫「可以休息，但你最好別休」。我們店裡也有這種規定。: That's "you can rest, but you'd better not." We have rules like that at my store too.
對「名義上可以休息」的說法很敏感。: Sensitive to "technically allowed to rest" arguments.
葛蘿莉亞・桑契斯: Gloria Sanchez
退休教師: Retired teacher
丈夫三年前在工地過世。: Her husband died on a construction site three years ago.
您先生的事，會影響您看這個案子嗎？: Would what happened to your husband affect how you see this case?
會。我沒辦法假裝不會。: Yes. I can't pretend it wouldn't.
親口承認無法公正。: Admitted in her own words that she can't be impartial.
亞歷山大・韋伯: Alexander Weber
銀行分行經理: Bank branch manager
五十歲，負責企業貸款。: Fifty, handles business loans.
大公司被告，您會先怎麼想？: When a big company gets sued, what's your first thought?
先想原告要多少錢。然後想那個數字合不合理。: How much the plaintiff is asking for. Then whether the number makes sense.
蘇米・帕特爾: Sumi Patel
咖啡店店員: Barista
二十六歲，下班後兼職外送。: Twenty-six, does delivery runs after work.
您兼職外送的時候，App 有提醒過您休息嗎？: When you're doing deliveries, has the app ever reminded you to rest?
有啊。我每次都按略過。不按的話，那天就白跑了。: Sure. I hit skip every time. If you don't, the whole day was for nothing.
自己就是外送員，對 App 的處境感同身受。: A delivery driver herself. Knows exactly what the app puts you through.
琳達・莫瑞: Linda Murray
百貨公司櫃姐: Department store sales associate
三十八歲，按業績抽成。: Thirty-eight, paid on commission.
業績不好的那個月，您會多上幾天班嗎？: In a slow month, do you work extra days?
會。沒有人逼我，可是也沒有人會幫我付房租。: I do. Nobody makes me. But nobody's going to pay my rent either.
艾德華・齊: Edward Chi
退役空軍飛行員: Retired Air Force pilot
飛了二十年，現在教模擬機。: Flew for twenty years. Now teaches on the simulator.
飛行員有強制休息的規定嗎？: Do pilots have mandatory rest rules?
有，而且沒有人可以按「略過」。那是因為以前有人死過。: Yes. And nobody gets to hit "skip." That's because people died before the rule existed.
對「強制休息被拿掉」非常敏感，但也重視個人責任。: Very sensitive to "mandatory rest was removed," but also values personal responsibility.
彼得・羅斯: Peter Ross
土木工程師: Civil engineer
負責橋梁的安全檢查。: Does safety inspections on bridges.
一個安全機制被改掉，您會先問什麼？: When a safety mechanism gets changed, what's your first question?
誰改的，為什麼改，改之前有沒有人評估。: Who changed it, why, and whether anyone assessed it first.
對「安全機制被改掉」非常在意，D7 曝光時會轉向。: Cares deeply about "a safety mechanism was changed." Turns when the change ticket comes out.
辯方，開場陳述。: Defense. Opening statement.
原告的直接詰問。她說的每一句都會讓陪審團心軟，你只能在問題本身有毛病的時候異議。: The plaintiff's direct. Every word she says will soften the jury. You can only object when the question itself is defective.
原告・死者遺孀: Plaintiff, the deceased's widow
維加太太，請告訴陪審團，赫克托是什麼樣的人。: Mrs. Vega, please tell the jury what kind of man Hector was.
他很安靜。每天早上七點出門，晚上回來會先去看女兒的房間，再吃飯。: He was quiet. Out the door at seven every morning. When he came home at night, he'd look in on our daughter's room before he ate.
他最後那兩個禮拜，為什麼每天跑那麼久？: Those last two weeks, why was he driving so long every day?
女兒的註冊費。他說跑完這兩個禮拜就好。: Our daughter's tuition. He said just these two weeks and that would be enough.
赫克托有沒有跟妳說過，公司的人告訴他不准休息？: Did Hector ever tell you that someone at the company told him he wasn't allowed to rest?
他說主管講過，旺季誰下線誰就等著被降級。: He said a manager had told them, anyone who goes offline in peak season can expect to be downgraded.
異議成立。證人只能說她自己知道的事。: Sustained. The witness may only testify to what she knows herself.
妳覺得卡爾德物流在乎他的命嗎？: Do you think Calder Logistics cared whether he lived?
他死了以後，他們的 App 還在叫他接單。: After he died, their app was still telling him to take orders.
異議成立。陪審團請忽略。: Sustained. The jury will disregard.
那天傍晚五點五十二分，妳收到了什麼？: That evening at 5:52, what did you receive?
一則語音。他說再跑兩單就回家，叫我先吃，不用等他。: A voice message. He said two more runs and he'd be home. Told me to eat without him.
公司的 App 在他死後還扣了他的分，這難道不是冷血嗎？: The company's app docked his rating after he died. Isn't that cold-blooded?
是。他們連他死了都不放過。: Yes. They wouldn't even leave him alone when he was dead.
異議成立。律師，請讓證人自己回答。: Sustained. Counsel, let the witness answer for herself.
他身體一直很好，從來沒有生過病。: His health was always good. He was never sick.
維加太太，您剛才說他身體一直很好。「一直」，是指包括最後那三個月嗎？: Mrs. Vega, you just said his health was always good. "Always." Does that include the last three months?
……對。他從來不喊累，也沒有生過病。: '...Yes. He never complained of being tired, and he was never sick.'
他身體應該還不錯吧？: His health was pretty good, I take it?
他不常看醫生。: He didn't see doctors much.
您先生的語音裡說「回家吃藥」。他吃的是什麼藥？: In your husband's voice message he says "home to take my pills." What pills was he taking?
我……我不知道。他沒有跟我說過。: I... I don't know. He never told me.
（她看著藥局紀錄看了很久）……三個月的藥，他只拿了一次。他說等這個月的錢下來。: (She looks at the pharmacy record for a long time) ...Three months of pills, and he only picked them up once. He said he'd go when this month's money came in.
他有在看醫生。我不知道他有沒有去拿藥。: He was seeing a doctor. I don't know if he picked up the pills.
公司逼他一直跑，他沒有辦法停下來。: The company forced him to keep driving. He couldn't stop.
維加太太，您說公司「逼」他。是有人規定他每天要跑幾個小時嗎？: Mrs. Vega, you said the company "forced" him. Did someone set how many hours a day he had to drive?
沒有人規定。可是大家都知道，不跑就排不到單。: Nobody set it. But everyone knows, if you don't drive, you don't get orders.
他工作壓力很大吧？: He was under a lot of pressure at work?
很大。: A lot.
他什麼時候出門、什麼時候收工，是誰決定的？: When he went out and when he stopped for the day. Who decided that?
……他自己。他說這是這份工作唯一的好處。: '...He did. He said it was the one good thing about the job.'
（她看著合約那一行）……上面是這樣寫。可是不跑，就沒有錢。: (She looks at the line in the contract) ...That's what it says. But if you don't drive, there's no money.
合約怎麼寫是一回事。: What the contract says is one thing.
他那天是要回家的，是 App 不讓他走。: He was going home that day. The app wouldn't let him.
您說那天是 App 不讓他走。他有跟您說過他想收工嗎？: You said the app wouldn't let him go. Did he tell you he wanted to stop for the day?
有。他傳了語音給我，說要回家。: Yes. He sent me the voice message. He said he was coming home.
他那天很想回家吧？: He really wanted to come home that day?
他每天都想回家。: He wanted to come home every day.
那則語音，您後來聽了幾次？: That voice message. How many times have you listened to it since?
（停了很久）每天。: (A long pause) Every day.
（語音播出來，她閉上眼睛）……「再跑兩單」。是他自己說的。: (The message plays. She closes her eyes) ..."Two more runs." He said it himself.
他說了要回家。他只是沒有回來。: He said he was coming home. He just didn't.
您和赫克托結婚多久了？: How long were you and Hector married?
二十二年。: Twenty-two years.
（瑪莉索低下頭。旁聽席有人倒抽一口氣。陪審席上，那位精算師在筆記本上寫了一行字。）: (Marisol lowers her head. Someone in the gallery draws a sharp breath. In the jury box, the actuary writes a line in her notebook.)
法官宣布休庭十分鐘。瑪莉索走下證人席，經過被告席時停了一下，沒有說話。: The judge calls a ten-minute recess. Marisol steps down and pauses as she passes the defense table. She says nothing.
原告專家・職業醫學: Plaintiff's expert, occupational medicine
費雪醫師，您的研究結論是什麼？: Dr. Fisher, what did your study conclude?
每週工時超過六十小時的司機，心血管事件的風險是一般人的二點四倍。: Drivers working more than sixty hours a week face 2.4 times the risk of a cardiovascular event.
所以赫克托的死，就是過勞造成的，對嗎？: So Hector's death was caused by overwork, correct?
是的。: Yes.
異議成立。請律師不要替證人作答。: Sustained. Counsel will not answer for the witness.
卡爾德物流的高層，應該早就知道這份研究吧？: Calder Logistics' executives must have known about this study?
這份研究發表在主要期刊上，業界應該都知道。: It was published in a major journal. The industry should be aware of it.
異議成立。證人無從得知被告高層讀過什麼。: Sustained. The witness has no way of knowing what the defendants' executives have read.
您的同事也告訴過您，外送司機的情況更糟，對嗎？: Your colleagues have also told you that delivery drivers have it worse, haven't they?
有幾位同業這樣跟我說過。: Several colleagues have told me that.
異議成立。證人只能就自己的研究作證。: Sustained. The witness may testify only to her own research.
這個倍數適用於所有長時間駕駛的司機，包括赫克托。: This multiplier applies to all drivers who drive long hours, including Hector.
醫師，您說「所有」長時間駕駛的司機。您的樣本裡，有市區外送司機嗎？: Doctor, you said "all" drivers who drive long hours. Were there any urban delivery drivers in your sample?
我的結論適用於長時間駕駛這件事本身。: My conclusion applies to long hours of driving as such.
您的研究應該也適用於外送司機吧？: Your study would apply to delivery drivers too, I suppose?
原則上是一樣的。: In principle, it's the same.
長途貨車司機一趟平均開多久？市區外送一單呢？: How long is an average run for a long-haul trucker? And an urban delivery?
長途大約九小時。市區外送……一單大概二、三十分鐘。: Long-haul, about nine hours. Urban delivery... twenty or thirty minutes an order.
（她翻到附註 7）……樣本是州際長途貨車司機。市區配送不在研究範圍內。: (She turns to footnote 7) ...The sample was interstate long-haul truckers. Urban delivery was outside the scope of the study.
樣本確實以長途司機為主，但我認為可以類推。: The sample was mainly long-haul drivers, yes, but I believe the finding extends.
赫克托根本沒有機會意識到自己需要休息。: Hector never had a chance to realize he needed to rest.
醫師，您是說他「根本沒有機會」知道自己該休息？: Doctor, you're saying he "never had a chance" to know he should rest?
在那種工作節奏下，沒有。: Not at that pace of work, no.
他可能沒注意到自己很累吧？: He may not have noticed how tired he was?
很多司機都沒注意到。: Many drivers don't.
您看過被告提出的 App 日誌嗎？: Have you seen the app log the defendants produced?
我看的是工時紀錄，沒有看提醒的部分。: I looked at the hours. I didn't look at the reminders.
……六十一次。我不知道系統提醒過他這麼多次。: "...Sixty-one times. I didn't know the system had reminded him that many times."
提醒是一回事，能不能停下來是另一回事。: A reminder is one thing. Being able to stop is another.
醫師，您的研究經費是誰出的？: Doctor, who funded your study?
州立大學和運輸工會。: The state university and the transport workers' union.
（精算師把筆放下，看著證人席上的附註頁。）: (The actuary puts down her pen and looks at the footnote page on the witness stand.)
費雪不能來了。他們找的是急診科醫師，只能講死因，不能講倍數。: Fisher's out. They've brought in an ER doctor. He can speak to cause of death, not to the multiplier.
麥可・唐醫師: Dr. Michael Tang
原告證人・急診科主治醫師: Plaintiff's witness, attending physician in emergency medicine
醫師，赫克托・維加的死因是什麼？: Doctor, what was the cause of Hector Vega's death?
急性心肌梗塞。: Acute myocardial infarction.
長時間工作會增加心肌梗塞的風險嗎？: Do long working hours increase the risk of a heart attack?
一般而言會。疲勞、壓力、睡眠不足都是因素。: Generally, yes. Fatigue, stress and lack of sleep are all factors.
如果他那天早點休息，就不會死，對吧？: If he had rested earlier that day, he wouldn't have died, right?
很可能。: Very likely.
費雪醫師的研究說風險是二點四倍，您同意嗎？: Dr. Fisher's study puts the risk at 2.4 times. Do you agree?
我讀過那份研究，數字是那樣寫的。: I've read the study. That's the number it gives.
異議成立。本庭已排除那項證詞，律師不得迂迴帶入。: Sustained. This court has excluded that testimony. Counsel will not bring it in through the back door.
公司明明可以讓他下線，卻沒有這麼做，對嗎？: The company could have taken him offline and chose not to, correct?
從醫學角度，強制休息確實能降低風險。: From a medical standpoint, mandatory rest does reduce the risk.
異議成立。證人是醫師，不是派單系統的專家。: Sustained. The witness is a physician, not an expert on dispatch systems.
疲勞是這次發作最主要的原因。: Fatigue was the main cause of this attack.
醫師，您說「最主要」的原因。比沒有控制的高血壓還主要？: Doctor, you said the "main" cause. More than uncontrolled hypertension?
我說的是疲勞是重要因素。: What I said is that fatigue was an important factor.
疲勞應該是原因之一吧？: Fatigue would be one of the causes, I suppose?
是原因之一。: One of them.
第二期高血壓沒有服藥，三個月後發生心肌梗塞的風險高嗎？: Stage 2 hypertension, untreated. Three months on, is the risk of a heart attack high?
很高。這是最主要的危險因子之一。: Very high. It's one of the primary risk factors.
（停頓）……如果他三個月只領了一次藥，那高血壓本身就是最主要的危險因子。: (A pause) ...If he filled the prescription only once in three months, then the hypertension itself was the primary risk factor.
兩者都有關係，我沒辦法區分。: Both played a part. I can't separate them.
以他的狀況，他自己很難察覺身體已經到極限了。: In his condition, he would have had a hard time noticing his body was at its limit.
醫師，您是說他沒有任何方式可以知道自己太累了？: Doctor, are you saying he had no way of knowing he was too tired?
醫學上，疲勞是很難自我察覺的。: Medically, fatigue is very hard to perceive in oneself.
疲勞很難自己察覺，對嗎？: Fatigue is hard to notice in yourself, isn't it?
對。: Yes.
如果有一個系統，每隔一段時間就跳出來提醒他該休息了，那算不算一種方式？: If a system popped up at intervals to remind him it was time to rest, would that count as a way of knowing?
……算。: '...It would.'
（看了一眼 App 日誌）六十一次……如果他每一次都看到了，那他知道。: (Glances at the app log) Sixty-one times... If he saw every one of them, then he knew.
提醒是一回事，身體的感覺是另一回事。: A reminder is one thing. What the body feels is another.
醫師，您在急診室工作多久了？: Doctor, how long have you worked in the ER?
十五年。: Fifteen years.
（護理師陪審員點了點頭，像是在說：我看過太多這種病人。）: "(The nurse on the jury nods, as if to say: I've seen too many of these patients.)"
盧卡斯站起來：「辯方傳喚崔佛・米爾斯。」崔佛扣上西裝的第一顆釦子，走向證人席。: 'Lucas stands: "The defense calls Trevor Mills." Trevor fastens the top button of his jacket and walks to the stand.'
只問他確定的事: Ask only what he's sure of
不碰疲勞鎖的歷史。他說得越少，奧卡福能拆的越少。: Stay off the history of the fatigue lock. The less he says, the less Okafor can take apart.
